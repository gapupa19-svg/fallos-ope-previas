na de las siguientes entidades:", "opts": {"A": "Hipofosfatasia.", "B": "Hipomagnesemia.", "C": "Hiperparatiroidismo.", "D": "Hipogonadismo."}, "correct": "D", "wrong": "C", "expl": "El hipogonadismo no es una causa metabólica reconocida de condrocalcinosis (depósito de pirofosfato cálcico dihidratado), a diferencia de la hipofosfatasia, la hipomagnesemia y el hiperparatiroidismo, que sí se han asociado clásicamente a esta entidad.", "truncated": false, "prevOk": false}, {"id": 68, "pg": [80], "temaKey": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "temaLabel": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "stem": "Ante una paciente en estudio por probable fibromialgia, ¿cuál de los siguientes procesos NO incluiría en el diagnóstico diferencial?", "opts": {"A": "Miopatías.", "B": "Apnea del sueño.", "C": "(E) hipertiroidismo.", "D": "Neuropatía periférica."}, "correct": "C", "wrong": "B", "expl": "El HIPOTIROIDISMO (no el hipertiroidismo) es una causa clásica de dolor musculoesquelético difuso y fatiga que debe incluirse en el diagnóstico diferencial de la fibromialgia; miopatías, apnea del sueño y neuropatía periférica sí forman parte habitual de ese diagnóstico diferencial.", "truncated": false, "prevOk": false}, {"id": 69, "pg": [81], "temaKey": "AUTOINMUNES - TEMA 41.- Esclerodermia. Sindrome de Sjógren. Polimiositis/dermatomiositis. Servicio Canario de la Enfermedad mixta del tejido conectivo y síndromes de solapamiento. Salud (SCS) - 2022", "temaLabel": "AUTOINMUNES - TEMA 41.- Esclerodermia. Sindrome de Sjógren. Polimiositis/dermatomiositis. Servicio Canario de la Enfermedad mixta del tejido conectivo y síndromes de solapamiento. Salud (SCS) - 2022", "stem": "La afectación pleuropulmonar en el Síndrome de Sjógren:", "opts": {"A": "No incluye el compartimento intersticial.", "B": "Se asocia a la aparición de linfoma pulmonar.", "C": "Latos es un síntoma excepcional en estos pacientes.", "D": "La presencia de autoanticuerpos anti-Ro/SSA y anti La/SSB excluyen esta enfermedad."}, "correct": "B", "wrong": "D", "expl": "El síndrome de Sjógren se asocia a mayor riesgo de linfoma no Hodgkin (habitualmente tipo MALT), incluido a nivel pulmonar. ES", "truncated": false, "prevOk": false}, {"id": 70, "pg": [82], "temaKey": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Servicio Canario de la Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios. Salud (SCS) - 2022", "temaLabel": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Servicio Canario de la Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios. Salud (SCS) - 2022", "stem": "Respecto a la poliarteritis nudosa, es falso que:", "opts": {"A": "Afecta a arterias musculares de mediano y pequeño tamaño.", "B": "Produce lesiones segmentarias con predilección por las zonas de bifurcación.", "C": "Puede aparecer a cualquier edad, pero se da sobre todo en la infancia.", "D": "Predomina en los varones."}, "correct": "D", "wrong": "C", "expl": "La poliarteritis nudosa clásica es rara en la infancia, siendo mucho más frecuente en adultos de mediana edad; el resto de características (arterias musculares, lesiones segmentarias, predominio en varones) son correctas. ES", "truncated": false, "prevOk": false}, {"id": 71, "pg": [83], "temaKey": "AUTOINMUNES - TEMA 39.- Artritis reumatoide y enfermedad de Still del adulto. Espondiloartritis.", "temaLabel": "AUTOINMUNES - TEMA 39.- Artritis reumatoide y enfermedad de Still del adulto. Espondiloartritis.", "stem": "En una de las siguientes enfermedades suele hallarse con más frecuencia líquido articular de tipo inflamatorio:", "opts": {"A": "Artropatías postraumáticas.", "B": "Artrosis.", "C": "Osteocondritis.", "D": "Artritis psoriásica."}, "correct": "D", "wrong": "B", "expl": "La artritis psoriásica es una artropatía inflamatoria que produce un líquido sinovial de tipo INFLAMATORIO (leucocitos elevados, predominio de PMN), a diferencia de las artropatías postraumáticas, la artrosis y la osteocondritis, que producen típicamente un líquido de tipo NO inflamatorio o mecánico.", "truncated": false, "prevOk": false}, {"id": 72, "pg": [84], "temaKey": "AUTOINMUNES - TEMA 40.- Lupus eritematoso sistémico. Sindrome antifostolípidos.", "temaLabel": "AUTOINMUNES - TEMA 40.- Lupus eritematoso sistémico. Sindrome antifostolípidos.", "stem": "Mujer de 26 años con alteración sensitiva de pierna izquierda hace 6 meses, que acude por dolor ocular a la movilización del ojo derecho y disminución de agudeza visual de 5 días. ¿Cuál será la primera sospecha diagnóstica?", "opts": {"A": "Vasculitis en el marco de una colagenosis.", "B": "Esclerosis múltiple.", "C": "Lupus eritematoso sistémico con afectación cerebral.", "D": "Patología vascular protrombótica."}, "correct": "B", "wrong": "A", "expl": "La combinación de dos episodios neurológicos separados en tiempo y espacio (alteración sensitiva en una pierna meses antes, ahora neuritis óptica) es el patrón clásico de diseminación temporoespacial característico de la esclerosis múltiple, siendo esta la primera sospecha diagnóstica ante este cuadro.", "truncated": false, "prevOk": false}, {"id": 73, "pg": [85], "temaKey": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "temaLabel": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "stem": "¿Cuál es la opción correcta en el tratamiento de la artritis por cristales de pirofostato cálcico?", "opts": {"A": "Los antiinflamatorios no esteroideos no se recomiendan en la actualidad.", "B": "En pacientes ingresados, el tratamiento de elección sería metilprednisolona 60 mg IV en dosis única.", "C": "En un paciente cirrótico con afectación oligoarticular se recomiendan glucocorticoides sistémicos.", "D": "La colchicina en dosis bajas diarias se recomienda tras el primer episodio para evitar brotes recurrentes."}, "correct": "C", "wrong": "D", "expl": "En un paciente cirrótico (con contraindicación relativa a AINE por riesgo de descompensación renal/hemorrágica) con afectación oligoarticular, los glucocorticoides sistémicos son una opción terapéutica razonable y segura para la artritis por pirofostato cálcico; los AINE sí siguen siendo una opción de primera línea en pacientes sin contraindicaciones, y la colchicina preventiva se plantea individualizadamente tras episodios RECURRENTES, no sistemáticamente tras el primero.", "truncated": false, "prevOk": false}, {"id": 74, "pg": [86], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "stem": "¿Cuál de estas entidades se asocia más claramente al reflujo gastroesofágico?", "opts": {"A": "Sinusitis crónica.", "B": "Erosiones dentales.", "C": "Fibrosis pulmonar idiopática.", "D": "Neumonía broncoaspirativa recurrente."}, "correct": "B", "wrong": "D", "expl": "Las erosiones del esmalte dental (afectando tipicamente a las caras palatinas de los incisivos superiores) constituyen una manifestación extraesofágica clásica y bien demostrada del ERGE por exposición ácida directa de la cavidad oral.", "truncated": false, "prevOk": false}, {"id": 75, "pg": [87], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "stem": "En el linfoma gástrico, ¿cuál de las siguientes NO es cierta?", "opts": {"A": "Esel segundo tumor maligno más frecuente del estómago (tras el adenocarcinoma).", "B": "Su pronóstico es mejor que el del adenocarcinoma gástrico.", "C": "Es sensible a la quimioterapia y a la radioterapia.", "D": "Generalmente se trata de un linfoma de Hodgkin."}, "correct": "D", "wrong": "C", "expl": "El linfoma gástrico primario es en la inmensa mayoría de los casos un linfoma B no Hodgkin (frecuentemente tipo MALT asociado a H. pylori, o difuso de célula grande B), nunca un linfoma de Hodgkin.", "truncated": false, "prevOk": false}, {"id": 76, "pg": [88], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "stem": "¿Cuál de las siguientes enfermedades es una inflamación crónica del esófago causada por un proceso autoinmune?", "opts": {"A": "Esotagitis eosinofilica.", "B": "Enfermedad de Chagas.", "C": "Esófago de Barrett.", "D": "Esclerosis sistémica."}, "correct": "D", "wrong": "A", "expl": "La esclerosis sistémica es una enfermedad autoinmune del tejido conectivo que produce fibrosis progresiva de la pared esofágica con hipomotilidad y esofagitis crónica secundaria; la esofagitis eosinofílica es de mecanismo alérgico (no autoinmune), Chagas es infecciosa y Barrett es metaplasia por ERGE.", "truncated": false, "prevOk": false}, {"id": 77, "pg": [89], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "stem": "Con respecto a los efectos del consumo crónico de alcohol sobre órganos y sistemas, ¿cuál es la respuesta FALSA?", "opts": {"A": "Un consumo de 4 bebidas alcohólicas al día aumenta unas tres veces el riesgo de neoplasias malignas de boca y esófago.", "B": "La frecuencia de pancreatitis aguda es casi siete veces mayor en alcohólicos que en la población general.", "C": "El alcohol es una de las causas más frecuentes de gastritis hemorrágica aguda.", "D": "Las personas con consumo excesivo de alcohol tienen un aumento significativo del riesgo de arteriopatía coronaria."}, "correct": "D", "wrong": "A", "expl": "El alcohol se asocia claramente a mayor riesgo de cáncer orofaríngeo/esofágico, pancreatitis y gastritis erosiva-hemorrágica, pero no existe una asociación consistente con un aumento del riesgo coronario (de hecho el consumo moderado se ha relacionado en estudios epidemiológicos con un patrón en J); el daño cardiovascular del alcohol excesivo se manifiesta sobre todo como miocardiopatia dilatada, arritmias e hipertensión.", "truncated": false, "prevOk": false}, {"id": 78, "pg": [90], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori.", "stem": "Respecto a la infección por Helicobacter pylori, señale la respuesta INCORRECTA:", "opts": {"A": "Enadultos con púrpura trombocitopénica idiopática, la erradicación de H. pylori tiende a aumentar el número total de plaquetas.", "B": "En pacientes con dicha infección, la incidencia de enfermedad por reflujo gastroesofágico es menor.", "C": "La infección crónica aumenta la respuesta a la inmunoterapia frente al cáncer.", "D": "La detección de antígeno en heces mediante ELISA con anticuerpos monoclonales tiene sensibilidad y especificidad superiores al 90%."}, "correct": "C", "wrong": "B", "expl": "No existe evidencia sólida de que la infección crónica por H. pylori mejore la respuesta a la inmunoterapia oncológica; si acaso, algunos estudios sugieren el efecto contrario a través de alteraciones del microbioma. Las otras afirmaciones (relación con PT!, menor incidencia de ERGE en infectados y alto rendimiento del antígeno en heces) están bien establecidas.", "truncated": false, "prevOk": false}, {"id": 79, "pg": [91], "temaKey": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori. Se incluyen dentro de las medidas terapéuticas antirreflujo (marque la respuesta correcta):", "temaLabel": "DIGESTIVO - TEMA 33.- Aproximación al paciente con enfermedad esótago-gástrica. Enfermedad por reflujo gastroesofágico. Infección por Helicobacter pylori. Se incluyen dentro de las medidas terapéuticas antirreflujo (marque la respuesta correcta):", "stem": "Se incluyen dentro de las medidas terapéuticas antirreflujo (marque la respuesta correcta):", "opts": {"A": "Dormir del lado derecho y con la cabecera incorporada.", "B": "Los antiácidos aumentan transitoriamente el pH intraluminal y alivian síntomas, pero no curan la esofagitis.", "C": "El baclofeno es útil en el ERGE refractario porque reduce las relajaciones transitorias del esfínter esofágico inferior.", "D": "Todas son medidas antirreflujo correctas."}, "correct": "B", "wrong": "D", "expl": "Dormir en decúbito LATERAL IZQUIERDO (no derecho) reduce el reflujo. El baclofeno sí reduce las relajaciones transitorias del EEl (ese es precisamente su mecanismo de acción como coadyuvante en ERGE refractario), por lo que la opción C es errónea tal y como está formulada. Los antiácidos tamponan el ácido pero no modifican la historia natural de la esofagitis, lo que hace correcta la opción B.", "truncated": false, "prevOk": false}, {"id": 80, "pg": [92], "temaKey": "DIGESTIVO - TEMA 34.- Hemorragia digestiva alta y baja.", "temaLabel": "DIGESTIVO - TEMA 34.- Hemorragia digestiva alta y baja.", "stem": "Paciente con insuficiencia renal crónica avanzada que acude por hemorragia digestiva alta. ¿Cuál es la etiología más probable del sangrado en este paciente?", "opts": {"A": "Úlcera duodenal.", "B": "Cáncer gástrico.", "C": "Cáncer duodenal.", "D": "Angiodisplasia."}, "correct": "D", "wrong": "A", "expl": "La uremia crónica se asocia a disfunción plaquetaria y a mayor prevalencia de angiodisplasias digestivas, que constituyen una causa característica y frecuente de HDA en pacientes con enfermedad renal crónica avanzada. Es", "truncated": false, "prevOk": false}, {"id": 81, "pg": [93], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Servicio Canario de la Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda. Salud (505) - 2022", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Servicio Canario de la Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda. Salud (505) - 2022", "stem": "¿Cuál de los siguientes síntomas es más común en la enfermedad de Crohn en comparación con la colitis ulcerosa?", "opts": {"A": "Diarrea crónica.", "B": "Sangrado rectal.", "C": "Dolor abdominal tipo cólico.", "D": "Pérdida de peso significativa."}, "correct": "C", "wrong": "A", "expl": "El dolor abdominal tipo cólico es más característico de la enfermedad de Crohn (afectación transmural, estenosante) que de la colitis ulcerosa, donde predominan la diarrea con sangre y el tenesmo.", "truncated": false, "prevOk": false}, {"id": 82, "pg": [94], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "stem": "Señale la respuesta INCORRECTA en relación a la infección por Strongyloides stercoralis:", "opts": {"A": "Se relaciona con el consumo de carne de cerdo poco cocinada.", "B": "La serología tiene valor en el seguimiento tras el tratamiento.", "C": "Se recomienda tratar los casos asintomáticos (por riesgo de hiperinfestación).", "D": "Puede simular una enfermedad inflamatoria Intestinal."}, "correct": "A", "wrong": "B", "expl": "Strongyloides stercoralis se transmite por penetración cutánea de larvas filaritormes desde el suelo contaminado, no por ingestión de carne de cerdo poco cocinada (esa vía es propia de Taenia solium o Trichinella spiralis).", "truncated": false, "prevOk": false}, {"id": 83, "pg": [95], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "stem": "En la misma paciente, con biopsia duodenal concordante con enfermedad celíaca, respecto a la evolución clínica e histológica es FALSO que:", "opts": {"A": "La dieta sin gluten mejorará la clínica y revertirá las alteraciones histológicas.", "B": "Lacausa más frecuente de persistencia de la clínica pese a la restricción de gluten es que la dieta no sea estricta.", "C": "La complicación más grave es el desarrollo de un linfoma T asociado a enteropatía.", "D": "Algunos pacientes pueden mejorar temporalmente con restricción de lactosa y grasas mientras se espera el efecto completo de la dieta sin gluten."}, "correct": "C", "wrong": "D", "expl": "La complicación más temida de la celiaquía no controlada (sobre todo en formas de diagnóstico tardio o mal cumplimiento) es el linfoma T asociado a enteropatia (EATL) y, en menor medida, el adenocarcinoma de intestino delgado, no la «enteritis eosinofilica», que no es la complicación característicamente descrita en este contexto.", "truncated": false, "prevOk": false}, {"id": 84, "pg": [96], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "stem": "Mujer de 18 años con acné y tumefacción inguinal dolorosa sin orificio de drenaje que le impide deambular, con algún episodio de diarrea sanguinolenta. Ante la sospecha de hidrosadenitis supurativa, señale lo que NO es cierto:", "opts": {"A": "Respecto a una posible Ell asociada, se ha encontrado relación con la enfermedad de Crohn pero no con la colitis ulcerosa,", "B": "Está descrita como parte del síndrome autoinflamatorio PAPASH.", "C": "En el tratamiento, además de antibióticos orales y AINE, están indicados los corticoides intralesionales.", "D": "El estadio 11! de Hurley se caracteriza por trayectos fistulosos y lesiones cicatriciales."}, "correct": "A", "wrong": "D", "expl": "La hidrosadenitis supurativa se ha asociado tanto a la enfermedad de Crohn como, con menor frecuencia, a la colitis ulcerosa, por lo que limitar la asociación únicamente al Crohn es incorrecto.", "truncated": false, "prevOk": false}, {"id": 85, "pg": [98], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y síndrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y síndrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "stem": "¿Cuál de las siguientes enfermedades está asociada con un mayor riesgo de obstrucción intestinal por adherencias?", "opts": {"A": "Entermedad inflamatoria intestinal.", "B": "Colitis ulcerosa.", "C": "Diverticulosis.", "D": "Apendicitis aguda."}, "correct": "A", "wrong": "D", "expl": "Los pacientes con enfermedad inflamatoria intestinal (particularmente Crohn) presentan un riesgo elevado de adherencias por la inflamación transmural recurrente y la mayor probabilidad de someterse a múltiples cirugías abdominales a lo largo de su evolución.", "truncated": false, "prevOk": false}, {"id": 86, "pg": [99], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda.", "stem": "Señale la afirmación INCORRECTA con respecto a la enfermedad de Crohn:", "opts": {"A": "Los síntomas más frecuentes son la diarrea crónica y el dolor abdominal.", "B": "Las fisuras anales son la manifestación perianal más frecuente.", "C": "Se distinguen tres fenotipos: inflamatorio, estenosante y fistulizante.", "D": "Es frecuente la positividad de los p-ANCA."}, "correct": "D", "wrong": "B", "expl": "Los p-ANCA son más característicos de la colitis ulcerosa (positivos en 50-70% de los casos); en la enfermedad de Crohn es más típica la positividad de los ASCA (anticuerpos anti- Saccharomyces cerevisiae).", "truncated": false, "prevOk": false}, {"id": 87, "pg": [100], "temaKey": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Servicio Canario de la Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda. Salud (SCS) - 2022", "temaLabel": "DIGESTIVO - TEMA 35.- Sindrome diarreico crónico y sindrome de malabsorción intestinal. Servicio Canario de la Enfermedad inflamatoria intestinal. Obstrucción intestinal aguda. Salud (SCS) - 2022", "stem": "En el tratamiento del síndrome de intestino irritable:", "opts": {"A": "Los antidepresivos inhibidores de la recaptación de serotonina, el alosetrón y los O antiespasmódicos han demostrado en metaanálisis su utilidad clínica frente a placebo.", "B": "El aumento en el consumo de fibra está recomendado en todas las guías, ya que su eficacia está claramente demostrada.", "C": "La lubiprostona y el tegaserod pueden ser útiles cuando existe predominio de diarrea.", "D": "La loperamida es muy útil cuando predomina el estreñimiento."}, "correct": "A", "wrong": "C", "expl": "Los antidepresivos, el alosetrón y los antiespasmódicos sí muestran eficacia frente a placebo en metaanálisis para el SIl; la fibra no tiene eficacia uniforme, y lubiprostona/loperamida se usan según el subtipo (estreñimiento o diarrea), no al revós.", "truncated": false, "prevOk": false}, {"id": 88, "pg": [101], "temaKey": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "temaLabel": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "stem": "Paciente de 62 años con etilismo crónico ingresado por pancreatitis aguda con buena evolución. A las 3 semanas se objetiva en ecografía una colección quística de 3 cm en contacto con la pared posterior gástrica, asintomática. ¿Cuál es la actitud inmediata más correcta?", "opts": {"A": "Drenaje percutáneo de la colección.", "B": "Tratamiento quirúrgico del pseudoquiste.", "C": "Drenaje endoscópico de la colección.", "D": "Seguimiento con ecografías seriadas."}, "correct": "D", "wrong": "C", "expl": "Los pseudoquistes pancreáticos asintomáticos, especialmente los de pequeño tamaño (<4-6 cm) y de aparición relativamente precoz, tienen una alta probabilidad de resolución espontánea, por lo que la actitud recomendada es la observación con controles de imagen seriados; el drenaje (percutáneo, endoscópico o quirúrgico) se reserva para pseudoquistes sintomáticos, complicados o en crecimiento progresivo. ES", "truncated": false, "prevOk": false}, {"id": 89, "pg": [102], "temaKey": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "temaLabel": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "stem": "Sobre el tratamiento de la necrosis pancreática infectada, señale la afirmación CORRECTA:", "opts": {"A": "Se debe sospechar ante la ausencia de mejoría clínica acompañada de fiebre y colecciones con presencia de gas.", "B": "Los microorganismos más frecuentemente implicados son Pseudomonas aeruginosa y grampositivos.", "C": "Está indicada la realización de PAAF guiada por TC para tinción de Gram y cultivo.", "D": "El desbridamiento quirúrgico se prefiere frente al abordaje percutáneo/endoscópico."}, "correct": "A", "wrong": null, "expl": "", "truncated": false, "prevOk": true}, {"id": 90, "pg": [104], "temaKey": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "temaLabel": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "stem": "¿Cuál de las siguientes NO es una complicación secundaria de la pancreatitis crónica?", "opts": {"A": "Dolores óseos (por necrosis grasa de la médula ósea).", "B": "Ictericia (por compresión de la vía biliar intrapancreática).", "C": "Eritoma nodoso.", "D": "Retinopatía carencial (por déficit de vitamina A)."}, "correct": "C", "wrong": "D", "expl": "El eritema nodoso no forma parte de las complicaciones reconocidas de la pancreatitis crónica (se relaciona más con sarcoidosis, Ell o infecciones estreptocócicas); en cambio, sí son complicaciones descritas la paniculitis/necrosis grasa con dolor óseo, la ictericia obstructiva por compresión biliar y la retinopatía por malabsorción de vitaminas liposolubles. E", "truncated": false, "prevOk": false}, {"id": 91, "pg": [105], "temaKey": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica. Servicio Canario de la Salud (SCS) - 2022", "temaLabel": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica. Servicio Canario de la Salud (SCS) - 2022", "stem": "¿Cuál de las siguientes complicaciones es más común en la pancreatitis crónica avanzada?", "opts": {"A": "Pancreatitis aguda recurrente.", "B": "Obstrucción biliar.", "C": "Diabetes mellitus.", "D": "Tumores quísticos."}, "correct": "C", "wrong": "A", "expl": "La insuficiencia pancreática endocrina progresiva (diabetes mellitus secundaria) es una complicación frecuente de la pancreatitis crónica avanzada, por destrucción del tejido de los islotes. E", "truncated": false, "prevOk": false}, {"id": 92, "pg": [106], "temaKey": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "temaLabel": "DIGESTIVO - TEMA 36.- Pancreatitis aguda y crónica.", "stem": "En la pancreatitis post-CPRE (colangiopancreatografía retrógrada endoscópica), señale la respuesta CORRECTA:", "opts": {"A": "Supone la quinta causa de pancreatitis aguda en frecuencia global.", "B": "Es más frecuente en varones con dilatación de la vía biliar.", "C": "La edad por debajo de 60 años y el sexo femenino son factores predisponentes.", "D": "Larealización de esfinterotomía no influye en su incidencia."}, "correct": "C", "wrong": "A", "expl": "Son factores de riesgo reconocidos de pancreatitis post-CPRE: sexo femenino, edad joven, disfunción del esfínter de Oddi, canulación dificiVrepetida, esfinterotomía pancreática y ausencia de dilatación de la vía biliar; el sexo masculino y la dilatación biliar, en cambio, se asocian a menor riesgo. E", "truncated": false, "prevOk": false}, {"id": 93, "pg": [107], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "Respecto al VHC, señale la respuesta correcta:", "opts": {"A": "La principal vía de transmisión es la parenteral, incluyendo utensilios de higiene personal contaminados con sangre (cepillos de dientes, maquinillas de afeitar).", "B": "La transmisión por vía sexual es, en general, altamente frecuente.", "C": "La transmisión vertical es muy frecuente, superando el 20-30% en madres infectadas.", "D": "La infección deja inmunidad protectora que impide la reinfección tras un tratamiento curativo."}, "correct": "A", "wrong": "B", "expl": "La vía parenteral (incluida la exposición indirecta a sangre a través de objetos de higiene personal compartidos) es la principal vía de transmisión del VHC. La transmisión sexual es relativamente poco eficiente en parejas heterosexuales estables, la transmisión vertical se sitúa en torno al 5-6% (mayor si cointección VIH), y la curación no confiere inmunidad protectora, siendo posible la reintección tras nueva exposición de riesgo.", "truncated": false, "prevOk": false}, {"id": 94, "pg": [108], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "De las siguientes afirmaciones sobre la infección crónica por el virus C de la hepatitis, ¿cuál es correcta?", "opts": {"A": "(3) se define por la persistencia de ARN-VHC detectable durante más de 6 meses.", "B": "En ausencia de tratamiento, la evolución a cirrosis ocurre en el 60% de los casos.", "C": "Existen marcadores serológicos específicos que diferencian la infección aguda de la crónica.", "D": "Actualmente es infrecuente la necesidad de biopsia hepática para el manejo clínico."}, "correct": "A", "wrong": "D", "expl": "La cronicidad se define por la persistencia del ARN-VHC más allá de 6 meses tras la infección; la progresión a cirrosis en ausencia de tratamiento ocurre en aproximadamente el 15-30% de los casos a los 20-30 años (no el 60%), no existen marcadores serológicos que distingan por sí solos infección aguda de crónica (se requiere el contexto clínico-temporal), y aunque hoy es cierto que se recurre poco a la biopsia gracias a métodos no invasivos, esto no constituye la característica definitoria de la infección crónica que pregunta el enunciado. E", "truncated": false, "prevOk": false}, {"id": 95, "pg": [109], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "¿Cuál de los siguientes marcadores serológicos es específico de la infección activa por el virus de la hepatitis B?", "opts": {"A": "Antígeno de superficie (HBSAg).", "B": "Anticuerpo contra el antígeno de superficie (Anti-HBs).", "C": "Anticuerpo contra el antígeno del core (Anti-HBc).", "D": "Antígono «e» del virus de la hepatitis B (HBeAg)."}, "correct": "A", "wrong": "D", "expl": "El HBsAg es el marcador serológico que define la presencia de infección activa (aguda o crónica) por VHB; su positividad mantenida más de 6 meses define cronicidad. Anti-HBs indica inmunidad (por infección resuelta o vacunación), y anti-HBc y HBeAg aportan información complementaria pero no confirman por sí solos infección activa. E", "truncated": false, "prevOk": false}, {"id": 96, "pg": [110], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "El riesgo de reactivación del VHB es alto en:", "opts": {"A": "Pacientes en tratamiento con rituximab o alemtuzumab, con AgHBs positivo (o AgHBs negativo y anti-HBc positivo).", "B": "Pacientes en tratamiento con infliximab y AgHBs positivo (o AgHBs negativo y anti- HBc positivo).", "C": "Pacientes en tratamiento con metotrexato en monoterapia y AgHBs positivo.", "D": "Todos los anteriores presentan idéntico riesgo alto de reactivación."}, "correct": "A", "wrong": "D", "expl": "Los fármacos que producen depleción profunda de linfocitos B (rituximab, alemtuzumab) constituyen el grupo de mayor riesgo de reactivación del VHB, independientemente del estado de AgHBs; los anti-TNF como infliximab confieren un riesgo intermedio-alto en portadores de AgHBs, y el metotrexato en monoterapia se clasifica habitualmente como de riesgo bajo-moderado, por lo que no todos los fármacos comparten el mismo nivel de riesgo.", "truncated": false, "prevOk": false}, {"id": 97, "pg": [111], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "¿Cuál de los siguientes virus de la hepatitis es la causa más frecuente de hepatitis crónica a nivel mundial?", "opts": {"A": "A — Virus de la hepatitis A.", "B": "Virus de la hepatitis B.", "C": "Virus de la hepatitis C.", "D": "Virus de la hepatitis E."}, "correct": "B", "wrong": "C", "expl": "Según estimaciones de la OMS, el número global de personas con infección crónica por VHB (en torno a 250-300 millones) supera ampliamente al de infección crónica por VHC (unos 58 millones), por lo que el VHB es la causa más frecuente de hepatitis crónica en el mundo; el VHA y el VHE, salvo en inmunodeprimidos (VHE), no cronifican. E", "truncated": false, "prevOk": false}, {"id": 98, "pg": [112], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "Indique, de entre los siguientes antivirales de acción directa frente al VHC, cuál NO se considera un fármaco pangenotípico:", "opts": {"A": "Velpatasvir.", "B": "Pibrentasvir."}, "correct": "A", "wrong": "C", "expl": "Simeprevir, un inhibidor de proteasa de primera generación, carece de actividad adecuada frente a varios genotipos (especialmente el 1a con mutación Q80K y el genotipo 3), por lo que no se considera pangenotípico, a diferencia de velpatasvir y pibrentasvir (y, con matices, grazoprevir en combinación) que forman parte de regímenes de amplio espectro genotípico. E", "truncated": false, "prevOk": false}, {"id": 99, "pg": [113], "temaKey": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "temaLabel": "DIGESTIVO - TEMA 37.- Hepatitis virales agudas y crónicas.", "stem": "Respecto a la interpretación serológica del virus de la hepatitis B, ¿cuál de las siguientes es correcta?", "opts": {"A": "AgHBs positivo, AntiHBs negativo, AntiHBc IgG positivo, AgHBe positivo, AntiHBe negativo: hepatitis B crónica con baja infectividad.", "B": "Ags negativo, AntiHBs positivo, AntiHBc negativo: estado postvacunación.", "C": "AgHBs positivo, AntiHBc positivo, AgHBe negativo, ADN <2000 Ul/ml, transaminasas normales e histología normal: «infección oculta».", "D": "Todas las anteriores son falsas."}, "correct": "B", "wrong": "C", "expl": "El patrón AgHBs negativo con AntiHBs positivo y AntiHBc negativo es característico del estado post-vacunal (anticuerpo protector aislado sin haber pasado la infección natural). El patrón de la opción A con AgHBe positivo indica en realidad ALTA replicación/infectividad, y el descrito en la opción C corresponde a un «portador inactivo» con AgHBs positivo, no a una infección oculta (que por definición cursa con AgHBs NEGATIVO).", "truncated": false, "prevOk": false}, {"id": 100, "pg": [115], "temaKey": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatia hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "temaLabel": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatia hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "stem": "¿Cuál de las siguientes afecciones se caracteriza por la inflamación crónica de los conductos biliares con obstrucción del flujo biliar?", "opts": {"A": "Colangitis (esclerosante).", "B": "Cirrosis hepática.", "C": "Hepatitis viral.", "D": "Enfermedad de Caroli."}, "correct": "A", "wrong": "B", "expl": "La colangitis (en su forma esclerosante, crónica) se define precisamente por la inflamación y fibrosis progresiva de los conductos biliares intra y/o extrahepáticos, con estenosis y obstrucción del flujo biliar, pudiendo evolucionar secundariamente a cirrosis biliar. ES", "truncated": false, "prevOk": false}, {"id": 101, "pg": [116], "temaKey": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatia hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "temaLabel": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatia hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "stem": "Cirrótico de 68 años con hipertensión portal, ascitis franca de 10 días de evolución. Paracentesis: albúmina 4 g/dl, leucocitos 500/mm? (85% PMN), eritrocitos 1100/mm?, Gram con cocos en cadena, cultivo positivo para neumococo. Señale la respuesta ERRÓNEA:", "opts": {"A": "En la bacteriascitis (cultivo positivo, PMN <250/mmv?) sin signos de infección no la] deben administrarse antibióticos, aunque se recomienda repetir la paracentesis para vigilar la progresión a PBE.", "B": "En este paciente, la profilaxis antibiótica futura solo estará indicada si además presenta una hemorragia digestiva alta por rotura de varices.", "C": "La profilaxis antibiótica de la PBE con rifaximina en pacientes cirróticos ofrece la ventaja adicional de prevenir la encefalopatía hepática.", "D": "El uso de inhibidores de la bomba de protones en pacientes cirróticos se ha D asociado a un aumento de la incidencia de PBE y de infección por Clostridioides difficile."}, "correct": "B", "wrong": "A", "expl": "Este paciente ya ha presentado un episodio de peritonitis bacteriana espontánea (PMN >250/mm* con cultivo positivo), lo que por sí solo constituye indicación de profilaxis antibiótica secundaria continuada (norfloxacino o ciprofloxacino), independientemente de que presente o no en el futuro una hemorragia digestiva por varices, que sería una indicación adicional de profilaxis PRIMARIA en otro contexto distinto.", "truncated": false, "prevOk": false}, {"id": 102, "pg": [117], "temaKey": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatía hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "temaLabel": "DIGESTIVO - TEMA 38.- Cirrosis hepáticas e hipertensión portal. Encefalopatía hepática. Descompensación hidrópica. Insuficiencia hepática aguda grave.", "stem": "Sobre la hipertensión portal como mecanismo fundamental de la ascitis en la cirrosis hepática, indique la respuesta INCORRECTA:", "opts": {"A": "Desencadena la liberación de óxido nítrico esplácnico.", "B": "Se produce una reducción secundaria de la resistencia vascular sistémica.", "C": "Se inhibe el sistema nervioso simpático.", "D": "Se estimula la secreción de hormona antidiurética (ADH)."}, "correct": "C", "wrong": "D", "expl": "La vasodilatación esplácnica mediada por óxido nítrico reduce la resistencia vascular sistémica y el volumen arterial efectivo, lo que ACTIVA (no inhibe) los sistemas neurohormonales vasoconstrictores y retenedores de sodio y agua: sistema renina-angiotensina-aldosterona, sistema nervioso simpático y hormona antidiurética, en un intento de mantener la presión arterial.", "truncated": false, "prevOk": false}, {"id": 103, "pg": [118], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "En la enfermedad de Wilson:", "opts": {"A": "La herencia es autosómica dominante y el gen de la enfermedad se localiza en el cromosoma 22.", "B": "La herencia es autosómica recesiva y el gen de la enfermedad se ha localizado en el cromosoma 19.", "C": "La herencia está ligada al cromosoma X.", "D": "La herencia es autosómica recesiva y el gen de la enfermedad se ha localizado en el cromosoma 13."}, "correct": "D", "wrong": "A", "expl": "La enfermedad de Wilson se hereda de forma autosómica recesiva por mutaciones en el gen ATP7B, localizado en el cromosoma 13.", "truncated": false, "prevOk": false}, {"id": 104, "pg": [119], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "El tumor maligno más común del intestino delgado es:", "opts": {"A": "Adenocarcinoma.", "B": "Linfoma intestinal.", "C": "Carcinoma de células escamosas.", "D": "Tumor estromal gastrointestinal (GIST)."}, "correct": "A", "wrong": "D", "expl": "El adenocarcinoma es el tumor maligno más frecuente del intestino delgado, seguido de los tumores carcinoides y los linfomas.", "truncated": false, "prevOk": false}, {"id": 105, "pg": [120], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "¿Cuál de las siguientes opciones es una causa común de colangitis?", "opts": {"A": "Colecistitis aguda.", "B": "Entermedad de Crohn.", "C": "Apendicitis.", "D": "Pancreatitis crónica."}, "correct": "A", "wrong": "B", "expl": "La colecistitis aguda (con posible migración de cálculos o infección ascendente) es una causa frecuente de colangitis aguda, a diferencia del Crohn, la apendicitis o la pancreatitis crónica.", "truncated": false, "prevOk": false}, {"id": 106, "pg": [121], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "¿Cuál de las siguientes exploraciones considera imprescindible para el diagnóstico de hemocromatosis primaria?", "opts": {"A": "Determinación de la sideremia.", "B": "Determinación del índice de saturación de transferrina.", "C": "Determinación de las cifras de ferritina.", "D": "Cuantificación del hierro hepático mediante biopsia."}, "correct": "D", "wrong": "B", "expl": "El diagnóstico de certeza de hemocromatosis primaria requiere cuantificar el hierro hepático (biopsia o RM cuantitativa), ya que la ferritina y la saturación de transferrina son solo pruebas de cribado.", "truncated": false, "prevOk": false}, {"id": 107, "pg": [122], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "¿Cuál es el tratamiento de elección en las fases iniciales de la enfermedad de Wilson?", "opts": {"A": "Trasplante hepático.", "B": "Administración de d-penicilamina.", "C": "Administración de acetato de cinc.", "D": "Noes necesario ningún tratamiento."}, "correct": "B", "wrong": "C", "expl": "La D-penicilamina (quelante de cobre) es el tratamiento de elección clásico en las fases iniciales de la enfermedad de Wilson, junto con dieta baja en cobre.", "truncated": false, "prevOk": false}, {"id": 108, "pg": [123], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "¿Cuál de estos enunciados es falso en la enfermedad de Wilson?", "opts": {"A": "Aumento del cobre hepático.", "B": "Aumento de la eliminación de cobre urinario.", "C": "En todos los casos la ceruloplasmina está disminuida.", "D": "Disminución de la concentración total de cobre en suero."}, "correct": "C", "wrong": "D", "expl": "En la enfermedad de Wilson la ceruloplasmina está descendida en la mayoría pero no en el 100% de los casos, por lo que una ceruloplasmina normal no descarta el diagnóstico.", "truncated": false, "prevOk": false}, {"id": 109, "pg": [124], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "El principal factor de riesgo para el desarrollo de cáncer colorrectal es:", "opts": {"A": "Edad avanzada.", "B": "Historia familiar de cáncer colorrectal.", "C": "Consumo excesivo de fibra dietética.", "D": "Uso ocasional de antiinflamatorios no esteroideos (AINEs)."}, "correct": "B", "wrong": "A", "expl": "La historia familiar de cáncer colorrectal (especialmente en familiares de primer grado) es el factor de riesgo individual más determinante, por delante de la edad avanzada (también relevante pero de menor peso relativo entre las opciones), mientras que la fibra dietética y el uso de AINE se asocian, por el contrario, a un efecto protector.", "truncated": false, "prevOk": false}, {"id": 110, "pg": [125], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "La práctica de sangrías en un paciente afecto de hemocromatosis primaria debe interrumpirse de forma definitiva:", "opts": {"A": "Cuando las cifras de ferritina se normalizan.", "B": "Cuando la saturación de transferrina se normaliza.", "C": "Cuando la concentración hepática de hierro se normaliza.", "D": "Nunca (excepto si aparecen contraindicaciones)."}, "correct": "D", "wrong": "B", "expl": "Las sangrías terapéuticas en la hemocromatosis deben mantenerse de por vida (con ajuste de frecuencia) salvo contraindicación, ya que la sobrecarga de hierro tiende a reproducirse si se detienen definitivamente.", "truncated": false, "prevOk": false}, {"id": 111, "pg": [126], "temaKey": "DIGESTIVO - EXTRA", "temaLabel": "DIGESTIVO - EXTRA", "stem": "¿Cuál de las siguientes opciones es una posible causa de náuseas y vómitos?", "opts": {"A": "Apendicitis aguda.", "B": "Hipertiroidismo.", "C": "Deficiencia de vitamina B12.", "D": "Intoxicación alimentaria."}, "correct": "D", "wrong": "A", "expl": "La intoxicación alimentaria es una causa común y directa de náuseas y vómitos agudos.", "truncated": false, "prevOk": false}, {"id": 112, "pg": [127], "temaKey": "ENDOCRINOLOGÍA - TEMA 46.- Enfermedades de las glándulas suprarrenales.", "temaLabel": "ENDOCRINOLOGÍA - TEMA 46.- Enfermedades de las glándulas suprarrenales.", "stem": "Los sistemas enzimáticos responsables de la metabolización de fármacos abundan en el hígado, pero también se encuentran en las estructuras que se citan, EXCEPTO en:", "opts": {"A": "Riñón.", "B": "Glándulas suprarrenales.", "C": "Piel.", "D": "Pared intestinal."}, "correct": "C", "wrong": "B", "expl": "Riñón, glándulas suprarrenales y pared intestinal poseen actividad relevante de enzimas metabolizadoras de fármacos (incluido citocromo P450), a diferencia de la piel, que no constituye un sitio significativo de metabolismo farmacológico sistémico.", "truncated": false, "prevOk": false}, {"id": 113, "pg": [148], "temaKey": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "temaLabel": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "stem": "Mujer de 86 años con IC NYHA lll y anemia por sangrado digestivo crónico (Hb basal -9,5 g/dl). Barthel 55, Pfeiffer 1. Vive con su hermana desde que enviudó. Ingresa por descompensación de IC, desarrollando un síndrome confusional hipoactivo. En relación al pronóstico, señale la correcta:", "opts": {"A": "Tiene un índice PROFUND bajo, con probabilidad de fallecimiento menor del 14% al año.", "B": "Tiene un índice PROFUND bajo-intermedio, con probabilidad de fallecimiento del 30% al año.", "C": "Tiene un índice PROFUND intermedio-alto, con probabilidad de fallecimiento del 50% al año.", "D": "Tiene un índice PROFUND alto, con probabilidad de fallecimiento del 60% al año."}, "correct": "C", "wrong": "B", "expl": "La combinación de dependencia funcional moderada (Barthel 55), deterioro cognitivo leve (Pfeiffer 1, aunque el delirium actual añade complejidad), insuficiencia cardiaca avanzada (NYHA 111), anemia crónica y ausencia de cuidador principal estable en el domicilio (convive con una hermana, no con cónyuge/hijos) suma una puntuación compatible con un índice PROFUND intermedio-alto, categoría asociada a una probabilidad de mortenimiento al año en torno al 50%. Siguiente", "truncated": false, "prevOk": false}, {"id": 114, "pg": [149], "temaKey": "GERIATRÍA - EXTRA", "temaLabel": "GERIATRÍA - EXTRA", "stem": "La pérdida de sensibilidad al tacto, la temperatura y el dolor se denomina:", "opts": {"A": "Hiperestesia.", "B": "Anestesia.", "C": "Hipoestesia.", "D": "Parestesia."}, "correct": "B", "wrong": "C", "expl": "La pérdida completa de la sensibilidad (tacto, temperatura, dolor) se denomina anestesia; la hipoestesia es una disminución parcial. Siguiente", "truncated": false, "prevOk": false}, {"id": 115, "pg": [150], "temaKey": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "temaLabel": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "stem": "Mujer de 82 años cuya hija refiere que en los últimos 3 meses come mucho menos, ha perdido interés en la comida y ha adelgazado considerablemente. Se realiza cribado nutricional con MNA-SF, obteniendo 10 puntos. ¿Qué indica este resultado? O La paciente se encuentra en riesgo de malnutrición. B_ La paciente tiene un estado nutricional satisfactorio. C Ninguna de las anteriores es correcta.", "opts": {"A": "La paciente se encuentra en riesgo de malnutrición.", "B": "La paciente tiene un estado nutricional satisfactorio.", "C": "Ninguna de las anteriores es correcta.", "D": "La paciente se encuentra malnutrida."}, "correct": "A", "wrong": "D", "expl": "En el Mini Nutritional Assessment-Short Form (MNA-SF, puntuación máxima 14), una puntuación de 8-11 puntos indica riesgo de malnutrición, mientras que una puntuación de 0-7 indicaría malnutrición establecida y =12 un estado nutricional normal; con 10 puntos, la paciente se encuentra en la categoría de riesgo de malnutrición, que requiere intervención nutricional precoz para evitar su progresión. Siguiente", "truncated": false, "prevOk": false}, {"id": 116, "pg": [151], "temaKey": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "temaLabel": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "stem": "Indique cuál de los siguientes NO es un ítem del índice de Barthel:", "opts": {"A": "Independencia para subir y bajar escaleras.", "B": "Capacidad para la deambulación.", "C": "Independencia para ir al aseo.", "D": "Capacidad para usar el dinero."}, "correct": "D", "wrong": "B", "expl": "La capacidad para el manejo del dinero es un ítem de la escala de Lawton-Brody (actividades instrumentales de la vida diaria), no del índice de Barthel, que evalúa actividades BÁSICAS de la vida diaria (alimentación, baño, vestido, aseo personal, deposición, micción, uso del retrete, traslados, deambulación y subir/bajar escaleras). Siguiente", "truncated": false, "prevOk": false}, {"id": 117, "pg": [152], "temaKey": "GERIATRÍA - EXTRA", "temaLabel": "GERIATRÍA - EXTRA", "stem": "Constituyen una causa de lesiones \"blancas\" en la mucosa bucal las siguientes excepto:", "opts": {"A": "Liquen plano.", "B": "Candidosis.", "C": "Verrugas por virus del papiloma.", "D": "Lengua vellosa."}, "correct": "D", "wrong": "C", "expl": "La lengua vellosa (hipertrofia e hiperpigmentación de papilas filiformes) no cursa con lesiones blancas verdaderas, a diferencia del liquen plano, la candidiasis oral o las verrugas por VPH. Siguiente", "truncated": false, "prevOk": false}, {"id": 118, "pg": [153], "temaKey": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "temaLabel": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "stem": "Señale la afirmación FALSA en relación al concepto de fragilidad:", "opts": {"A": "Es un síndrome médico caracterizado por pérdida de fuerza y resistencia, y O disminución de la función fisiológica que aumenta la vulnerabilidad para desarrollar dependencia o fallecer.", "B": "La velocidad de la marcha, la movilidad, la actividad física y la valoración de los estados mental y nutricional pueden ser útiles para el diagnóstico.", "C": "La actividad física constituye un tratamiento.", "D": "Es equiparable a dependencia y multimorbilidad."}, "correct": "D", "wrong": "A", "expl": "La fragilidad NO es equiparable a dependencia ni a multimorbilidad: son conceptos relacionados pero distintos (un paciente frágil puede ser independiente, y la multimorbilidad es un factor de riesgo de fragilidad pero no sinónimo de ella); precisamente el interés clínico de la fragilidad radica en que es un estado potencialmente REVERSIBLE si se detecta antes de la dependencia establecida. Siguiente", "truncated": false, "prevOk": false}, {"id": 119, "pg": [154], "temaKey": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "temaLabel": "GERIATRÍA - TEMA 3.- Medicina geriátrica y cuidados paliativos.", "stem": "Mujer de 79 años que ingresa por fractura osteoporótica de cadera. Respecto a la prevención secundaria de fracturas por fragilidad, señale la respuesta INCORRECTA:", "opts": {"A": "La baja adherencia al tratamiento se asocia a un incremento del riesgo de fractura.", "B": "Los marcadores de remodelado óseo pueden ser útiles para monitorizar de forma precoz la respuesta al tratamiento.", "C": "La vitamina D en monoterapia es eficaz en la reducción de dichas fracturas en personas mayores no institucionalizadas.", "D": "El aumento de calcio dietético o la toma aislada de suplementos de calcio no protegen frente a la aparición de fracturas."}, "correct": "C", "wrong": "B", "expl": "La vitamina D en MONOTERAPIA (sin calcio ni tratamiento antirresortivo/anabólico asociado) no ha demostrado ser eficaz para reducir el riesgo de fracturas en personas mayores no institucionalizadas; su beneficio se ha demostrado sobre todo asociada a calcio, especialmente en personas institucionalizadas con déficit franco. Siguiente", "truncated": false, "prevOk": false}, {"id": 120, "pg": [155], "temaKey": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "temaLabel": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "stem": "Señale la respuesta CORRECTA en relación con las anemias megaloblásticas:", "opts": {"A": "Los niveles de homocisteína y ácido metilmalónico están elevados tanto en el déficit de B12 como en el de ácido fólico.", "B": "Hasta un 20% de la vitamina B12 ingerida se absorbe en el tubo digestivo mediante difusión pasiva.", "C": "La determinación de anticuerpos frente a factor intrínseco es una prueba poco sensible pero muy específica para el diagnóstico de anemia perniciosa.", "D": "Los alimentos que contienen mayor cantidad de vitamina B12 son de origen vegetal."}, "correct": "C", "wrong": "B", "expl": "Los anticuerpos anti-factor intrínseco tienen una especificidad muy alta pero una sensibilidad limitada (presentes solo en una parte de los pacientes con anemia perniciosa), por lo que un resultado negativo no la descarta. El ácido metilmalónico solo se eleva en el déficit de B12 (no en el de folato, ya que interviene específicamente en una vía metabólica dependiente de B12), y la vitamina B12 se encuentra en alimentos de origen ANIMAL, no vegetal.", "truncated": false, "prevOk": false}, {"id": 121, "pg": [156], "temaKey": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "temaLabel": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "stem": "En una paciente hospitalizada con síndrome hemolítico urémico con indicación de inicio inmediato de eculizumab, ¿cuál sería la actitud más apropiada?", "opts": {"A": "Administrar la vacuna meningocócica tetravalente conjugada ACYW y la vacuna frente al serogrupo B tan pronto como sea posible.", "B": "Iniciar profilaxis antibiótica con penicilina oral.", "C": "Retrasar el inicio de eculizumab hasta dos semanas después de la vacunación frente a meningococo.", "D": "Las respuestas «a» y «b» son ciertas."}, "correct": "D", "wrong": "A", "expl": "El eculizumab (inhibidor del complemento terminal) aumenta considerablemente el riesgo de infección meningocócica invasiva, por lo que se recomienda vacunación frente a meningococo (tetravalente ACYW y serogrupo B) lo antes posible, junto con profilaxis antibiótica hasta que la respuesta vacunal sea completa, sin retrasar el inicio del fármaco en una situación urgente que lo requiere.", "truncated": false, "prevOk": false}, {"id": 122, "pg": [157], "temaKey": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "temaLabel": "HEMATOLOGÍA - TEMA 55.- Estudio del paciente con anemia. Anemia ferropénica y otras anemias hipoproliferativas. Anemias megaloblásticas. Anemias hemolíticas.", "stem": "En relación a los datos de laboratorio y al tratamiento de la anemia posthemorrágica aguda, señale la proposición VERDADERA:", "opts": {"A": "ñ Desde el primer momento, la Hb y el hematocrito descienden en relación directa con la cuantía de la hemorragia.", "B": "Puede observarse la presencia de eritroblastos en sangre periférica.", "C": "La perfusión de grandes cantidades de expansores del plasma puede producir C trastornos del funcionalismo de los neutrófilos, con aumento del riesgo de infecciones.", "D": "Si la médula ósea es normal, se producirá un aumento de los reticulocitos, con pico máximo a las 48 horas de la hemorragia."}, "correct": "B", "wrong": "D", "expl": "En la anemia posthemorrágica aguda con médula ósea normal, la respuesta reticulocitaria puede ser intensa e incluir la liberación de formas inmaduras (eritroblastos) a la sangre periférica; la Hb y el hematocrito NO descienden de forma inmediata proporcional a la pérdida (se requiere tiempo para la hemodilución compensadora), y el pico reticulocitario máximo se alcanza en torno al 5-7\" día, no a las 48 horas.", "truncated": false, "prevOk": false}, {"id": 123, "pg": [158], "temaKey": "HEMATOLOGÍA - TEMA 56.- Gammapatías monoclonales. Trastornos de las células", "temaLabel": "HEMATOLOGÍA - TEMA 56.- Gammapatías monoclonales. Trastornos de las células", "stem": "En relación al tratamiento de la amiloidosis cardiaca señale lo incorrecto:", "opts": {"A": "El tratamiento con tafamidis es eficaz en la amiloidosis por transtirretina, tanto en su forma hereditaria (ATTRv), como en el tipo salvaje (ATTRwt).", "B": "Enpacientes con fibrilación auricular se recomienda anticoagulación con independencia de la puntuación de la escala CHADS2Vasc.", "C": "El Tafamidis, al ser un estabilizador de los tetrámeros de transtirretina tarda más de un año en lograr beneficio.", "D": "En las guías europeas de insuficiencia cardiaca (IC) se recomienda el tratamiento con tafamidis en pacientes con IC en clase funcional |-1l."}, "correct": "D", "wrong": "C", "expl": "Las guías europeas de IC recomiendan el tafamidis específicamente en clase funcional |-11; el resto de afirmaciones (eficacia en ATTRv y ATTRwt, anticoagulación independiente de CHA2DS2- VASc en amiloidosis con FA, retraso del beneficio >1 año) son correctas. ES", "truncated": false, "prevOk": false}, {"id": 124, "pg": [159], "temaKey": "HEMATOLOGÍA - TEMA 56.- Gammapatías monoclonales. Trastornos de las células", "temaLabel": "HEMATOLOGÍA - TEMA 56.- Gammapatías monoclonales. Trastornos de las células", "stem": "En relación a la amiloidosis cardiaca señale lo incorrecto:", "opts": {"A": "Más del 95% de amiloidosis cardiaca están causadas por dos tipos de amiloidosis: amiloidosis de cadenas ligeras (AL) o amiloidosis por transtirretina (ATTR).", "B": "La ausencia de pico monoclonal en suero no permite excluir el diagnóstico de amiloidosis AL.", "C": "Se recomienda realizar test genético a todos los pacientes con amiloidosis ATTR.", "D": "La captación grado 2 de una gammagrafía con Tecnecio permite diagnosticar amiloidosis TTR."}, "correct": "D", "wrong": "B", "expl": "Una captación grado 2 en la gammagrafía con pirofostatos/Tc-DPD, en ausencia de componente monoclonal, ya permite el diagnóstico no invasivo de amiloidosis por TTR; sin embargo, el enunciado la marca como incorrecta porque simplifica en exceso (se requiere también descartar gammapatía monoclonal). ES", "truncated": false, "prevOk": false}, {"id": 125, "pg": [161], "temaKey": "HEMATOLOGÍA - TEMA 57.- Alteraciones de la hemostasia. Tratamiento anticoagulante y fibrinolítico. Tratamiento transtusional.", "temaLabel": "HEMATOLOGÍA - TEMA 57.- Alteraciones de la hemostasia. Tratamiento anticoagulante y fibrinolítico. Tratamiento transtusional.", "stem": "Todos los medicamentos utilizados en el tratamiento inmediato del infarto de miocardio con elevación del ST concuerdan con su mecanismo de acción, EXCEPTO:", "opts": {"A": "Abciximab - inhibición del receptor de la glucoproteína llb/llla.", "B": "Antagonistas beta-adrenérgicos - disminución del consumo de oxígeno miocárdico.", "C": "Clopidogrel - inhibición del receptor de ADP plaquetario.", "D": "Nitroglicerina - disminución de la poscarga cardiaca."}, "correct": "D", "wrong": "B", "expl": "La nitroglicerina actúa fundamentalmente reduciendo la PRECARGA (por venodilatación, con disminución del retorno venoso), no principalmente la poscarga; el resto de emparejamientos son correctos.", "truncated": false, "prevOk": false}, {"id": 126, "pg": [162], "temaKey": "HEMATOLOGÍA - TEMA 57.- Alteraciones de la hemostasia. Tratamiento anticoagulante y fibrinolítico. Tratamiento transtusional.", "temaLabel": "HEMATOLOGÍA - TEMA 57.- Alteraciones de la hemostasia. Tratamiento anticoagulante y fibrinolítico. Tratamiento transtusional.", "stem": "En la hemorragia asociada al uso de inhibidores del factor Xa, ¿cuál de estas afirmaciones es FALSA?", "opts": {"A": "La dosis de andexanet depende del tiempo transcurrido desde la última dosis de anticoagulante.", "B": "La diálisis es de utilidad para eliminar el inhibidor del factor Xa.", "C": "Está indicada la administración de ácido tranexámico.", "D": "El uso de andexanet lleva consigo riesgo de trombosis."}, "correct": "B", "wrong": null, "expl": "", "truncated": false, "prevOk": true}, {"id": 127, "pg": [164], "temaKey": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "temaLabel": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "stem": "¿Cuál de las siguientes manifestaciones no se incluye dentro de las afecciones renales de la diabetes mellitus?", "opts": {"A": "Glomerulosclerosis nodular.", "B": "Uropatía obstructiva neurógena.", "C": "Necrosis papilar.", "D": "Hiperaldosteronismo hiperreninémico."}, "correct": "D", "wrong": "B", "expl": "El hiperaldosteronismo hiperreninémico no es una manifestación renal reconocida de la diabetes; de hecho, es más típico el hipoaldosteronismo hiporreninémico (acidosis tubular tipo IV). Siguiente", "truncated": false, "prevOk": false}, {"id": 128, "pg": [165], "temaKey": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "temaLabel": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "stem": "¿Cuál de los siguientes es una manifestación extrarrenal de enfermedad de riñón poliquístico autosómico dominante?", "opts": {"A": "Prolapso de la válvula mitral.", "B": "Insuficiencia aórtica.", "C": "Aneurisma intracraneal.", "D": "Todas son posibles manifestaciones."}, "correct": "D", "wrong": "C", "expl": "La poliquistosis renal autosómica dominante se asocia a múltiples manifestaciones extrarrenales: aneurismas intracraneales, prolapso mitral e insuficiencia aórtica, entre otras. Siguiente", "truncated": false, "prevOk": false}, {"id": 129, "pg": [166], "temaKey": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico. Enfermedad tubular renal.", "temaLabel": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico. Enfermedad tubular renal.", "stem": "La gran mayoría de los casos de necrosis cortical renal se deben a:", "opts": {"A": "Glomerulonefritis agudas.", "B": "Complicaciones del embarazo (desprendimiento de placenta, sepsis puerperal).", "C": "Vasculitis sistémicas."}, "correct": "B", "wrong": null, "expl": "Las complicaciones obstétricas graves (desprendimiento prematuro de placenta, sepsis puerperal, preeclampsia grave) son la causa clásica y más frecuente de necrosis cortical renal bilateral, por vasoespasmo intenso e isquemia cortical prolongada. Siguiente", "truncated": false, "prevOk": false}, {"id": 130, "pg": [167], "temaKey": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico. Enfermedad tubular renal.", "temaLabel": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico. Enfermedad tubular renal.", "stem": "En el síndrome nefrótico es FALSO que:", "opts": {"A": "Aumenta la síntesis hepática de albúmina (mecanismo compensador, insuficiente).", "B": "Aumenta la eliminación urinaria de antitrombina lll.", "C": "Aumenta la eliminación urinaria de IgG.", "D": "Su causa más frecuente es «la glomerulonefritis», sin más especificación."}, "correct": "D", "wrong": "A", "expl": "La causa más frecuente de síndrome nefrótico varía según la edad y las series (enfermedad de cambios mínimos en niños, nefropatía membranosa o glomeruloesclerosis focal y segmentaria en adultos, nefropatía diabética como causa secundaria más frecuente en general), por lo que una respuesta genérica e inespecífica como «la glomerulonefritis» no resulta correcta como causa única y bien definida. Siguiente", "truncated": false, "prevOk": false}, {"id": 131, "pg": [168], "temaKey": "NEFROLOGÍA - TEMA 30.- Aproximación al paciente con insuficiencia renal aguda. Insuficiencia renal crónica.", "temaLabel": "NEFROLOGÍA - TEMA 30.- Aproximación al paciente con insuficiencia renal aguda. Insuficiencia renal crónica.", "stem": "En la hipertensión arterial asociada a la insuficiencia renal crónica, ¿cuál es el factor patogenético más importante?", "opts": {"A": "Estenosis de las arterias renales.", "B": "Retención de sodio y agua.", "C": "Hiperaldosteronismo secundario.", "D": "Producción excesiva de renina."}, "correct": "B", "wrong": "C", "expl": "La expansión de volumen por retención de sodio y agua, consecuencia de la reducción del filtrado glomerular, es el mecanismo patogénico predominante y más importante de la hipertensión arterial asociada a la enfermedad renal crónica, aunque la activación del sistema renina-angiotensina también contribuye en muchos casos.", "truncated": false, "prevOk": false}, {"id": 132, "pg": [169], "temaKey": "NEFROLOGÍA - TEMA 30.- Aproximación al paciente con insuficiencia renal aguda. Insuficiencia renal crónica.", "temaLabel": "NEFROLOGÍA - TEMA 30.- Aproximación al paciente con insuficiencia renal aguda. Insuficiencia renal crónica.", "stem": "Varón de 42 años ADVP, ingresado por bacteriemia por SARM en tratamiento con vancomicina, con creatinina en ascenso (1,5>2,8 mg/dl), C3 bajo, C4 normal, crioglobulinas negativas; orina con 50-100 hematíes/campo, proteinuria 19/24h y cilindros hemáticos; ecografía renal normal. ¿Cuál es la causa más probable de la insuficiencia renal aguda?", "opts": {"A": "Necrosis tubular aguda por vancomicina.", "B": "Glomerulonefritis relacionada con la infección.", "C": "Nefritis intersticial alérgica.", "D": "Embolismos sépticos."}, "correct": "B", "wrong": "A", "expl": "El sedimento nefrítico activo (hematuria con cilindros hemáticos, proteinuria), el consumo de complemento C3 y el contexto de bacteriemia estafilocócica (endocarditis subyacente probable en un ADVP) son muy sugestivos de glomerulonefritis relacionada con la infección (mediada por inmunocomplejos), un mecanismo distinto de la simple nefrotoxicidad por vancomicina. Siguiente", "truncated": false, "prevOk": false}, {"id": 133, "pg": [170], "temaKey": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "temaLabel": "NEFROLOGÍA - TEMA 32.- Enfermedad glomerular y síndrome nefrótico.", "stem": "Señale la afirmación correcta en relación a un paciente que presenta en un análisis de orina de 24 horas una proteinuria de 350 mg.", "opts": {"A": "Presenta proteinuria en rango normal.", "B": "Presenta proteinuria patológica.", "C": "Presenta proteinuria en rango nefrótico.", "D": "Presenta microalbuminuria."}, "correct": "B", "wrong": "C", "expl": "Una proteinuria de 350 mg/24h supera el límite normal (<150 mg/24h) pero está muy por debajo del rango nefrótico (>3,5 g/24h), por lo que se considera proteinuria patológica no nefrótica.", "truncated": false, "prevOk": false}, {"id": 134, "pg": [171], "temaKey": "NEFROLOGÍA - TEMA 31.- Alteraciones del metabolismo del sodio y potasio.", "temaLabel": "NEFROLOGÍA - TEMA 31.- Alteraciones del metabolismo del sodio y potasio.", "stem": "El poliestireno sulfonato cálcico (Resincalcio) se usa para el tratamiento de la hiperpotasemia. ¿Cuál de los siguientes NO se encuentra entre sus posibles efectos secundarios?", "opts": {"A": "Estreñimiento.", "B": "Hipocalcemia.", "C": "Hipopotasemia (por sobrecorrección).", "D": "Isquemia y necrosis intestinal."}, "correct": "B", "wrong": "C", "expl": "La formulación CÁLCICA de esta resina de intercambio catiónico libera calcio al intercambiarlo por potasio, por lo que su efecto adverso relacionado con el calcio esperable sería hipercalcemia, no hipocalcemia (que sí puede verse con la formulación sódica, que además puede unir calcio); estreñimiento, hipopotasemia por exceso de efecto e isquemia/necrosis intestinal (efecto adverso grave, aunque infrecuente) sí son riesgos reconocidos.", "truncated": false, "prevOk": false}, {"id": 135, "pg": [191], "temaKey": "NEUROLÓGICA - TEMA 51.- Enfermedad cerebrovascular.", "temaLabel": "NEUROLÓGICA - TEMA 51.- Enfermedad cerebrovascular.", "stem": "Si decimos que un paciente tiene un Rankin 2, ¿de qué grado de incapacidad hablamos?.", "opts": {"A": "Ninguno, paciente sin discapacidad.", "B": "Severa.", "C": "Moderada."}, "correct": "B", "wrong": "D", "expl": "En la escala de Rankin modificada, la puntuación 2 corresponde a discapacidad leve (incapaz de realizar todas las actividades previas, pero capaz de valerse por sí mismo sin ayuda). Siguiente", "truncated": false, "prevOk": false}, {"id": 136, "pg": [192], "temaKey": "NEUROLÓGICA - EXTRA", "temaLabel": "NEUROLÓGICA - EXTRA", "stem": "Cuál de los siguientes signos o síntomas aparece raramente en la esclerosis múltiple?", "opts": {"A": "Síndrome piramidal.", "B": "Hemianopsia homónima.", "C": "Neuritis óptica.", "D": "Ataxia y temblor cerebelosos."}, "correct": "B", "wrong": "D", "expl": "La hemianopsia homónima (lesión de vía óptica retroquiasmática) es infrecuente en la esclerosis múltiple, que afecta característicamente al nervio óptico (neuritis óptica), la vía piramidal y el cerebelo. Siguiente", "truncated": false, "prevOk": false}, {"id": 137, "pg": [193], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "¿Cuál de las siguientes opciones sobre la enfermedad de Parkinson es VERDADERA?", "opts": {"A": "El tabaquismo se ha asociado con menor riesgo de desarrollar la enfermedad.", "B": "La edad avanzada al momento de la presentación tiene mayor probabilidad de relacionarse con una predisposición genética.", "C": "La enfermedad de Parkinson se ha identificado como un trastorno monogénico relacionado con mutaciones en la a-sinucleína en la mayoría de los casos.", "D": "La característica patológica distintiva es la presencia de ovillos neurofibrilares y proteína tau en la sustancia negra."}, "correct": "A", "wrong": "D", "expl": "De forma epidemiológicamente consistente (aunque paradójica), el tabaquismo se ha asociado a un MENOR riesgo de desarrollar enfermedad de Parkinson; la mayoría de los casos son esporádicos (no monogénicos), las formas genéticas (mutaciones de a-sinucleína, LRRK2, entre otras) son más frecuentes en el inicio a edad TEMPRANA (no avanzada), y la característica patológica distintiva son los cuerpos de Lewy (agregados de a-sinucleína), no los ovillos neurofibrilares de tau (propios del Alzheimer). Siguiente", "truncated": false, "prevOk": false}, {"id": 138, "pg": [194], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "¿Cuáles son las manifestaciones no motoras adicionales de la enfermedad de Parkinson?", "opts": {"A": "Trastornos autónomos, alteraciones sensoriales y deterioro cognitivo.", "B": "Trastornos autónomos, alteraciones sensoriales y discapacidad visual.", "C": "Trastornos autónomos, alteraciones auditivas y deterioro cognitivo.", "D": "Trastornos autónomos, alteraciones sensoriales y deterioro olfativo."}, "correct": "A", "wrong": "D", "expl": "Los trastornos autónomos (disautonomía), las alteraciones sensoriales (dolor, parestesias) y el deterioro cognitivo son manifestaciones no motoras clásicas y clínicamente relevantes de la enfermedad de Parkinson, junto con el deterioro olfativo (hiposmia, un pródromo característico), los trastornos del sueño y los síntomas neuropsiquiátricos. Siguiente", "truncated": false, "prevOk": false}, {"id": 139, "pg": [195], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "¿Cuál de las siguientes entidades no suele cursar con distonía?", "opts": {"A": "(13) síndrome de Gilles de la Tourette.", "B": "Tratamiento crónico con neurolépticos.", "C": "Entermedad de Wilson.", "D": "Corea de Huntington."}, "correct": "A", "wrong": "C", "expl": "El sindrome de Gilles de la Tourette se caracteriza por tics motores y vocales, no por distonía, a diferencia de la enfermedad de Wilson, la corea de Huntington o el tratamiento neuroléptico crónico, que sí pueden producir distonía. Siguiente", "truncated": false, "prevOk": false}, {"id": 140, "pg": [196], "temaKey": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "temaLabel": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "stem": "La enfermedad de Gerstmann-Stráussler-Scheinker se caracteriza por:", "opts": {"A": "Demencia con mioclonías rápidamente progresiva.", "B": "Estar causada por priones.", "C": "Encontrarse en el diagnóstico diferencial de las ataxias progresivas esporádicas.", "D": "Transmitirse por herencia autosómica recesiva."}, "correct": "D", "wrong": "B", "expl": "A diferencia de otras enfermedades priónicas hereditarias, el síndrome de Gerstmann- Stráussler-Scheinker se transmite con un patrón autosómico DOMINANTE (no recesivo), asociado a mutaciones del gen PRNP; sí está causada por priones, cursa con ataxia progresiva de curso más lento que la demencia con mioclonías rápidamente progresiva característica de la enfermedad de Creutzfeldt- Jakob clásica, y forma parte del diagnóstico diferencial de las ataxias progresivas esporádicas del adulto. Siguiente", "truncated": false, "prevOk": false}, {"id": 141, "pg": [197], "temaKey": "NEUROLÓGICA - TEMA 50.- Aproximación al paciente con síndrome convulsivo. Epilepsias.", "temaLabel": "NEUROLÓGICA - TEMA 50.- Aproximación al paciente con síndrome convulsivo. Epilepsias.", "stem": "En relación a los fármacos antiepilépticos, señale la INCORRECTA:", "opts": {"A": "Carbamazepina, gabapentina, fenitoína y primidona pueden producir descenso de los niveles de ácido fólico.", "B": "Fenobarbital, pregabalina, primidona y topiramato pueden producir descenso de los niveles de vitamina B12.", "C": "Fenitoína, carbamazepina y fenobarbital se asocian a mayor prevalencia de hiperlipidemia.", "D": "En caso de síndrome de DRESS por fenitoína, se recomienda cambiar a carbamazepina."}, "correct": "D", "wrong": "C", "expl": "Ante un síndrome de DRESS por fenitoína NO se recomienda cambiar a carbamazepina, ya que existe reactividad cruzada entre los antiepilépticos aromáticos (fenitoína, carbamazepina, fenobarbital, oxcarbazepina), debiendo evitarse todos ellos y optar por un fármaco de estructura no aromática (como levetiracetam o ácido valproico).", "truncated": false, "prevOk": false}, {"id": 142, "pg": [198], "temaKey": "NEUROLÓGICA - EXTRA", "temaLabel": "NEUROLÓGICA - EXTRA", "stem": "Sobre la distrofia miotónica tipo | (enfermedad de Steinert), señale la afirmación INCORRECTA:", "opts": {"A": "La debilidad muscular en extremidades es de predominio distal.", "B": "Es una enfermedad autosómica recesiva con penetrancia casi completa.", "C": "Enesta enfermedad son características las cataratas posteriores subcapsulares.", "D": "Hay que vigilar la aparición frecuente de bloqueos de conducción cardiaca."}, "correct": "B", "wrong": "A", "expl": "La distrofia miotónica de Steinert se hereda de forma autosómica DOMINANTE (por expansión de tripletes CTG), no recesiva. Siguiente", "truncated": false, "prevOk": false}, {"id": 143, "pg": [199], "temaKey": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras", "temaLabel": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras", "stem": "Entre las complicaciones neurológicas de la pelagra NO se encuentra:", "opts": {"A": "Demencia.", "B": "Paraparesia espástica.", "C": "Neuropatía periférica.", "D": "Hemiparesia."}, "correct": "D", "wrong": "B", "expl": "La hemiparesia (focalidad motora lateralizada) no es una manifestación típica de la pelagra (déficit de niacina), cuyas complicaciones neurológicas clásicas son la demencia, la paraparesia espástica y la neuropatía periférica, de distribución simétrica. O (A e, bad ¿JO loja U<- eno -— . . dad_Nub...docx", "truncated": false, "prevOk": false}, {"id": 144, "pg": [200], "temaKey": "NEUROLÓGICA - EXTRA", "temaLabel": "NEUROLÓGICA - EXTRA", "stem": "¿Cuál es la prueba complementaria de elección en la esclerosis lateral amiotrófica?", "opts": {"A": "Electromiograma.", "B": "Potenciales evocados.", "C": "TC cerebro.", "D": "Punción lumbar."}, "correct": "A", "wrong": "B", "expl": "El electromiograma (con estudio de conducción nerviosa) es la prueba complementaria clave en la ELA, al demostrar signos de denervación activa y crónica en varios territorios (afectación de segunda motoneurona). Siguiente", "truncated": false, "prevOk": false}, {"id": 145, "pg": [201], "temaKey": "NEUROLÓGICA - TEMA 51.- Enfermedad cerebrovascular.", "temaLabel": "NEUROLÓGICA - TEMA 51.- Enfermedad cerebrovascular.", "stem": "Señale la respuesta FALSA en cuanto al tratamiento del ictus:", "opts": {"A": "Nose ha demostrado beneficio de los anticoagulantes en el tratamiento primario de la isquemia cerebral aterotrombótica, con incremento del riesgo hemorrágico.", "B": "El ácido acetilsalicílico es el único antiagregante con eficacia probada para el tratamiento inmediato de la crisis isquémica en monoterapia clásica.", "C": "El estudio NINDS mostró un beneficio claro del rtPA IV en algunos pacientes con ictus agudo.", "D": "La combinación de clopidogrel y AAS no es efectiva en la prevención de un segundo ictus aterotrombótico."}, "correct": "D", "wrong": "B", "expl": "La doble antiagregación de corta duración con clopidogrel más AAS (típicamente 21 días) SÍ ha demostrado ser eficaz en la prevención de un segundo ictus en pacientes seleccionados con AIT de alto riesgo o ictus isquémico menor, según ensayos como CHANCE y POINT, por lo que afirmar que «no es efectiva» es incorrecto. Siguiente", "truncated": false, "prevOk": false}, {"id": 146, "pg": [202], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "En relación con la demencia con cuerpos de Lewy, indique la opción FALSA:", "opts": {"A": "Son frecuentes las fluctuaciones cognitivas y atencionales.", "B": "El parkinsonismo se incluye entre los criterios diagnósticos.", "C": "Los síntomas psicóticos son frecuentes, predominando las alucinaciones visuales.", "D": "Los neurolépticos deben utilizarse en la mayoría de pacientes para controlar los trastornos conductuales."}, "correct": "D", "wrong": "A", "expl": "Los pacientes con demencia con cuerpos de Lewy presentan una hipersensibilidad característica a los neurolépticos, que pueden producir reacciones extrapiramidales graves e incluso un cuadro similar al síndrome neuroléptico maligno, por lo que su uso debe evitarse o reservarse con máxima precaución, no utilizarse «en la mayoría de pacientes». Siguiente", "truncated": false, "prevOk": false}, {"id": 147, "pg": [203], "temaKey": "NEUROLÓGICA - TEMA 54.- Sindrome neuroléptico maligno. Hipertermia maligna.", "temaLabel": "NEUROLÓGICA - TEMA 54.- Sindrome neuroléptico maligno. Hipertermia maligna.", "stem": "¿Cuál de las siguientes afirmaciones es CORRECTA respecto a la hipertermia maligna?", "opts": {"A": "Esun síndrome hipermetabólico desencadenado tras la exposición a neurolépticos.", "B": "Ocurre en pacientes genéticamente susceptibles.", "C": "La enfermedad es relativamente frecuente y tiene buen pronóstico.", "D": "Elfracaso renal es excepcional."}, "correct": "B", "wrong": "C", "expl": "La hipertermia maligna es un trastorno farmacoge
