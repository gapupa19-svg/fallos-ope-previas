nético (mutaciones del receptor de rianodina del músculo esquelético, entre otras) que ocurre en individuos genéticamente predispuestos expuestos a determinados anestésicos (no a neurolépticos, que es lo que desencadena el síndrome neuroléptico maligno, entidad distinta); es una enfermedad poco frecuente que, sin tratamiento precoz con dantroleno, puede ser rápidamente mortal, y el fracaso renal agudo por rabdomiólisis es una complicación reconocida, no excepcional. Siguiente", "truncated": false, "prevOk": false}, {"id": 148, "pg": [204], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "¿Cuál es el tumor cerebral que con más frecuencia produce parkinsonismo?", "opts": {"A": "Meningioma.", "B": "Metástasis.", "C": "Glioblastoma multiforme.", "D": "Oligodendroglioma."}, "correct": "A", "wrong": "C", "expl": "El meningioma, especialmente cuando se localiza en la convexidad frontal o parasagital comprimiendo los ganglios basales o sus vías, es el tumor cerebral que con mayor frecuencia se ha asociado clásicamente a la aparición de un síndrome parkinsoniano secundario. Siguiente", "truncated": false, "prevOk": false}, {"id": 149, "pg": [205], "temaKey": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "temaLabel": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "stem": "Varón de 62 años con cambios de personalidad, desinhibición conductual (comentarios sexuales inapropiados, irritabilidad, pérdida de normas sociales) y deterioro de memoria progresivo, con un accidente de tráfico reciente. MMSE 20/30. Exploración motora, sensitiva y cerebelosa normal. ¿Cuál es el diagnóstico más probable?", "opts": {"A": "Enfermedad de Alzheimer.", "B": "Demencia con cuerpos de Lewy.", "C": "Demencia frontotemporal (variante conductual).", "D": "Demencia vascular."}, "correct": "C", "wrong": "A", "expl": "El predominio de cambios precoces y marcados de personalidad, desinhibición social y conductual (con relativa preservación motora y sin alucinaciones o parkinsonismo prominentes), por delante del deterioro amnésico puro, es característico de la variante conductual de la demencia frontotemporal, que suele debutar a edades más jóvenes que el Alzheimer típico. Siguiente", "truncated": false, "prevOk": false}, {"id": 150, "pg": [206], "temaKey": "NEUROLÓGICA - EXTRA", "temaLabel": "NEUROLÓGICA - EXTRA", "stem": "La alteración pupilar en el síndrome de Claude-Bernard-Horner se produce por:", "opts": {"A": "Compresión del lll par craneal.", "B": "Lesión protuberancial.", "C": "Afectación simpática.", "D": "Afectación parasimpática."}, "correct": "C", "wrong": "B", "expl": "El síndrome de Horner (ptosis, miosis, anhidrosis) se produce por lesión de la vía simpática oculosimpática, no por afectación parasimpática ni del l!l par. Siguiente", "truncated": false, "prevOk": false}, {"id": 151, "pg": [207], "temaKey": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "temaLabel": "NEUROLÓGICA - TEMA 53.- Aproximación al paciente con deterioro cognitivo. Enfermedad de Alzheimer y otras demencias.", "stem": "Señale la respuesta FALSA con respecto a la enfermedad de Alzheimer:", "opts": {"A": "Los síntomas neuropsiquiátricos en la enfermedad de Alzheimer son poco comunes.", "B": "Los inhibidores de la colinesterasa no producen una mejoría clínicamente significativa en los síntomas neuropsiquiátricos.", "C": "Estos medicamentos tienen una modesta mejora en la cognición.", "D": "Los inhibidores de la colinesterasa se consideran terapias sintomáticas, no neuroprotectoras."}, "correct": "A", "wrong": "B", "expl": "Los síntomas neuropsiquiátricos (apatía, depresión, ansiedad, agitación, psicosis) son, en realidad, MUY comunes a lo largo de la evolución de la enfermedad de Alzheimer, apareciendo en la mayoría de los pacientes en algún momento de la enfermedad, no siendo infrecuentes como sugiere la afirmación. Siguiente", "truncated": false, "prevOk": false}, {"id": 152, "pg": [208], "temaKey": "NEUROLÓGICA - EXTRA", "temaLabel": "NEUROLÓGICA - EXTRA", "stem": "Indique el tumor primario intracraneal más frecuentemente diagnosticado en el adulto:", "opts": {"A": "Meningioma.", "B": "Glioblastoma multiforme.", "C": "Neurinoma.", "D": "Adenoma hipofisario."}, "correct": "B", "wrong": "A", "expl": "El glioblastoma multiforme es el tumor cerebral primario más frecuente en el adulto entre los gliomas malignos de alto grado. Siguiente", "truncated": false, "prevOk": false}, {"id": 153, "pg": [209], "temaKey": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "temaLabel": "NEUROLÓGICA - TEMA 52.- Enfermedad de Parkinson y otras discinesias.", "stem": "Varón de 70 años con temblor en reposo y dificultad para abrocharse botones y atarse cordones. Exploración con rigidez en rueda dentada. Señale la correcta:", "opts": {"A": "El tratamiento de elección es levodopa-carbidopa a dosis altas desde el inicio.", "B": "El temblor es el síntoma que experimentará un beneficio rápido incluso con dosis bajas de levodopa.", "C": "Los efectos secundarios más graves de la levodopa incluyen confusión, alucinaciones, delirios, agitación, psicosis e hipotensión ortostática.", "D": "Sino hay respuesta clínica, se recomienda suspender bruscamente la levodopa."}, "correct": "C", "wrong": "B", "expl": "Los efectos adversos neuropsiquiátricos (confusión, alucinaciones, psicosis) y disautonómicos (hipotensión ortostática) de la levodopa son los más graves y limitantes, especialmente en pacientes ancianos; el tratamiento se inicia habitualmente a dosis bajas y se ajusta progresivamente (no a dosis altas desde el inicio), el temblor suele ser el síntoma que MENOS responde a la levodopa (mejor a bradicinesia y rigidez), y la suspensión brusca está contraindicada por el riesgo de síndrome neuroléptico maligno-like.", "truncated": false, "prevOk": false}, {"id": 154, "pg": [211], "temaKey": "NUTRICIÓN OBESIDAD - TEMA 5.- Conceptos generales en nutrición. Requerimientos y evaluación nutricional. Nutrición enteral y parenteral. Obesidad y trastornos alimentarios", "temaLabel": "NUTRICIÓN OBESIDAD - TEMA 5.- Conceptos generales en nutrición. Requerimientos y evaluación nutricional. Nutrición enteral y parenteral. Obesidad y trastornos alimentarios", "stem": "¿Cuál de los siguientes factores de riesgo se asocia principalmente con la formación de cálculos biliares?", "opts": {"A": "Consumo excesivo de alcohol.", "B": "Diabetes tipo 1.", "C": "(3) obesidad.", "D": "Hipertensión arterial."}, "correct": "C", "wrong": "A", "expl": "La obesidad, al aumentar la secreción biliar de colesterol y favorecer la sobresaturación de la bilis, es un factor de riesgo clásico y bien establecido para la formación de cálculos biliares de colesterol. DA AAA (A e, bad ¿JO loja U<- eno -— - > dad_Nuk....docx A . €", "truncated": false, "prevOk": false}, {"id": 155, "pg": [212], "temaKey": "NUTRICIÓN OBESIDAD - TEMA 5.- Conceptos generales en nutrición. Requerimientos y evaluación nutricional. Nutrición enteral y parenteral. Obesidad y trastornos alimentarios.", "temaLabel": "NUTRICIÓN OBESIDAD - TEMA 5.- Conceptos generales en nutrición. Requerimientos y evaluación nutricional. Nutrición enteral y parenteral. Obesidad y trastornos alimentarios.", "stem": "Varón de 71 años, jubilado, que consulta por ronquidos nocturnos. IMC 31,5 kg/m?, ligera somnolencia diurna postprandial sin otros síntomas relevantes. ¡AH en polisomnografía de 18. ¿Cuál es la medida más adecuada?", "opts": {"A": "Medidas higiénico-dietéticas y control evolutivo.", "B": "CPAP (presión positiva continua en la vía aérea).", "C": "Ventilación mecánica no invasiva.", "D": "Oxigenoterapia nocturna."}, "correct": "B", "wrong": "A", "expl": "Un IAH >15 (SAHS moderado) acompañado de síntomas es indicación de tratamiento con CPAP según las guías de las sociedades de neumología.", "truncated": false, "prevOk": false}, {"id": 156, "pg": [213], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del Servicio Canario de la cáncer. Infecciones en los pacientes con cáncer. Salud (SCS) - 2022", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del Servicio Canario de la cáncer. Infecciones en los pacientes con cáncer. Salud (SCS) - 2022", "stem": "La palpación de un ganglio de Virchow-Troisier, ¿a qué patología debe orientarnos?", "opts": {"A": "Adenocarcinoma duodenal.", "B": "Adenocarcinoma pancreático.", "C": "Adenocarcinoma gástrico.", "D": "Carcinoma hepatocelular."}, "correct": "C", "wrong": "B", "expl": "El ganglio de Virchow-Troisier (supraclavicular izquierdo) es un signo clásico de diseminación linfática del adenocarcinoma gástrico. Siguiente", "truncated": false, "prevOk": false}, {"id": 157, "pg": [214], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del Servicio Canario de la cáncer. Infecciones en los pacientes con cáncer. Salud (SCS) - 2022", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del Servicio Canario de la cáncer. Infecciones en los pacientes con cáncer. Salud (SCS) - 2022", "stem": "¿Cuál de las siguientes opciones NO es una estrategia en la detección precoz del cáncer?", "opts": {"A": "Mamografía.", "B": "Papanicolaou.", "C": "Biopsia.", "D": "Colonoscopia."}, "correct": "C", "wrong": "D", "expl": "La biopsia es una prueba diagnóstica de confirmación, no una técnica de cribado/detección precoz como la mamografía, la citología cervical o la colonoscopia. Siguiente", "truncated": false, "prevOk": false}, {"id": 158, "pg": [215], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "Respecto a las neoplasias endocrinas múltiples tipo 1 (MEN1), es FALSO que:", "opts": {"A": "Pueden afectar a cualquier grupo de edad, entre los 5 y los 81 años.", "B": "Se describen formas familiares con herencia autosómica dominante, pero también formas esporádicas.", "C": "Las manifestaciones clínicas se desarrollan sobre todo en la 2”-3* década de la vida.", "D": "La causa más frecuente de muerte es por tumores malignos, sobre todo neuroendocrinos de páncreas o carcinoide intestinal."}, "correct": "C", "wrong": null, "expl": "", "truncated": false, "prevOk": true}, {"id": 159, "pg": [216], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "La causa más común de estenosis esofágica es:", "opts": {"A": "Cáncer de esófago.", "B": "Enfermedad por reflujo gastroesofágico (ERGE).", "C": "Esófago de Barrett.", "D": "Esclerosis sistémica."}, "correct": "B", "wrong": "A", "expl": "La estenosis péptica secundaria a esofagitis crónica por ERGE es, con diferencia, la causa más frecuente de estenosis esofágica benigna en la práctica clínica. Siguiente", "truncated": false, "prevOk": false}, {"id": 160, "pg": [217], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "Un paciente oncológico que precisa tratamiento con rituximab presenta serología con HBsAg negativo y anti-HBc positivo. Señale la opción INCORRECTA:", "opts": {"A": "Precisa profilaxis frente a la reactivación del VHB.", "B": "Elrituximab se asocia a un riesgo alto de reactivación en este perfil serológico.", "C": "Debe iniciarse la pauta antiviral al menos 2 semanas antes del tratamiento con rituximab.", "D": "El tratamiento antiviral se mantendrá únicamente hasta el cese del tratamiento con rituximab."}, "correct": "D", "wrong": "C", "expl": "Debido al efecto prolongado de depleción de linfocitos B del rituximab, la profilaxis antiviral debe mantenerse entre 12 y 18 meses DESPUÉS de finalizar el tratamiento, no solo hasta su cese, para cubrir el periodo de reconstitución inmunológica en que persiste el riesgo de reactivación. Siguiente", "truncated": false, "prevOk": false}, {"id": 161, "pg": [218], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "Paciente oncológico portador de sonda vesical con sospecha de ITU complicada, en tratamiento empírico con cefotaxima intravenosa. Hemocultivos con crecimiento de Pseudomonas aeruginosa, pendiente de antibiograma. ¿Qué respuesta es correcta?", "opts": {"A": "Mantener el tratamiento con cefotaxima a la espera de confirmar sensibilidad.", "B": "Retirar la cefotaxima e iniciar tratamiento con ertapenem.", "C": "Cambiar el tratamiento a ceftazidima.", "D": "Añadir trimetoprim-sulfametoxazo!l para conseguir sinergia y mayor cobertura."}, "correct": "C", "wrong": "B", "expl": "La cefotaxima carece de actividad útil frente a Pseudomonas aeruginosa, por lo que debe cambiarse a un antibiótico con actividad antipseudomónica, como la ceftazidima; el ertapenem, a diferencia de otros carbapenémicos, tampoco cubre Pseudomonas. Siguiente", "truncated": false, "prevOk": false}, {"id": 162, "pg": [219], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "¿Cuál de las siguientes NO es una característica histopatológica frecuente del cáncer de mama asociado a mutación en el gen BRCA1?", "opts": {"A": "Alto grado histológico.", "B": "Receptor de estrógenos negativo.", "C": "Perfil genético tipo basal-like.", "D": "(E), Sobreexpresión de c-erbB2 (HER2) positiva."}, "correct": "D", "wrong": "A", "expl": "Los tumores asociados a mutación de BRCA1 son característicamente HER2 NEGATIVOS, con un perfil predominantemente triple negativo (RE-, RP-, HER2-) y de tipo basal-like, alto grado histológico y elevado índice proliferativo, siendo la sobreexpresión de HER2 una característica infrecuente en este subgrupo. Siguiente", "truncated": false, "prevOk": false}, {"id": 163, "pg": [220], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "En cuanto al tratamiento antibiótico en pacientes oncológicos, señale la respuesta correcta:", "opts": {"A": "En un paciente con neutropenia y tiflitis, alérgico a betalactámicos, el tratamiento de elección es vancomicina en combinación con amikacina.", "B": "El uso de la escala CISNE implica comprobar que el paciente es mayor de 18 años de edad.", "C": "La presencia de catéteres venosos centrales es factor de riesgo de infección por Enterococcus spp., primando por tanto meropenem como betalactámico empírico.", "D": "Ceftazidima es la cefalosporina de elección en caso de infección neumocócica."}, "correct": "B", "wrong": "A", "expl": "La escala CISNE está validada y diseñada específicamente para pacientes ADULTOS (218 años) con neutropenia febril de apariencia clínicamente estable, por lo que su aplicación exige comprobar este criterio de edad; la ceftazidima tiene actividad limitada frente a neumococo (no es de elección para esta infección), y los catéteres venosos centrales se asocian más a estafilococos coagulasa negativos que a Enterococcus. Siguiente", "truncated": false, "prevOk": false}, {"id": 164, "pg": [221], "temaKey": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "temaLabel": "ONCOLOGÍA - TEMA 4.- Aproximación al paciente con cáncer. Detección sistemática del cáncer. Infecciones en los pacientes con cáncer.", "stem": "En el diagnóstico del cáncer, señale la respuesta CORRECTA:", "opts": {"A": "El estudio histológico precisa técnicas inmunohistoquímicas y de detección de alteraciones moleculares para su diagnóstico definitivo.", "B": "La PAAF tiene una incidencia de falsos negativos del 15-18%.", "C": "La obtención de dos PAAF negativas descarta el cáncer.", "D": "La determinación de anormalidades genéticas asociadas a mutaciones del ADN permite la selección de tratamientos individualizados."}, "correct": "D", "wrong": "A", "expl": "La caracterización molecular del tumor (mutaciones driver, biomarcadores) permite seleccionar terapias dirigidas específicas (medicina de precisión oncológica), siendo esta la afirmación más precisa; aunque la inmunohistoquímica y los estudios moleculares SÍ son relevantes, no siempre son imprescindibles para el diagnóstico histológico definitivo de todos los tumores, y ni una ni dos PAAF negativas descartan por completo el cáncer, dada la posibilidad de falsos negativos por muestreo inadecuado. Siguiente", "truncated": false, "prevOk": false}];
(function(){
"use strict";
const KEY='repaso_fallos_opeprevias_v1';
const $app=document.getElementById('app');
const LETTERS=['A','B','C','D','E'];
let S=load();
let sess=null;

function load(){
  const d={lvl:{},xp:0,streak:0,lastDay:null,unl:false,seen:0,ok:0,theme:'auto'};
  try{const r=localStorage.getItem(KEY);if(r){Object.assign(d,JSON.parse(r));}}catch(e){}
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();}
function touchStreak(){
  const t=today();
  if(S.lastDay===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=(S.lastDay===yk)?S.streak+1:1;
  S.lastDay=t;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function lvl(id){return S.lvl[id]||0;}
function mastered(id){return lvl(id)>=2;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function applyTheme(){
  if(S.theme==='dark')document.documentElement.setAttribute('data-theme','dark');
  else if(S.theme==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme();

const temaMap=(()=>{
  const m=new Map();
  QUESTIONS.forEach(q=>{const k=q.temaKey||'—';if(!m.has(k))m.set(k,{key:k,label:q.temaLabel||'Sin tema',ids:[]});m.get(k).ids.push(q.id);});
  return [...m.values()].sort((a,b)=>{
    const na=parseInt(a.key),nb=parseInt(b.key);
    if(isNaN(na)&&isNaN(nb))return 0;if(isNaN(na))return 1;if(isNaN(nb))return -1;return na-nb;
  });
})();
let filterKeys=new Set();

/* ---------- HOME ---------- */
function home(){
  sess=null;
  const total=QUESTIONS.length;
  const dom=QUESTIONS.filter(q=>mastered(q.id)).length;
  const pend=total-dom;
  const pct=total?Math.round(dom/total*100):0;
  const sel=poolIds();
  $app.innerHTML=`
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><div class="logo">🏥</div><span>REPASO FALLOS</span></div>
      <div class="chips-top">
        <div class="pill fire">🔥 ${S.streak||0}</div>
        <div class="pill xp">⭐ ${S.xp||0}</div>
      </div>
    </div>
    <div class="hero">
      <h1>OPE Previas · tus fallos</h1>
      <p>${total} preguntas de tu banco de fallos de OPE Sprint (convocatorias previas). Una pregunta pasa a <b>dominada</b> cuando la aciertas en dos sesiones distintas.</p>
      <div style="margin-top:14px" class="bar"><i style="width:${pct}%"></i></div>
      <div class="statgrid">
        <div class="stat g"><b>${dom}</b><span>Dominadas</span></div>
        <div class="stat r"><b>${pend}</b><span>Pendientes</span></div>
        <div class="stat b"><b>${pct}%</b><span>Progreso</span></div>
      </div>
    </div>

    <h2 class="sec">Tema</h2>
    <div class="chips" id="chips">
      <button class="chip ${filterKeys.size===0?'on':''}" data-k="__all">Todos<small>${total}</small></button>
      ${temaMap.map(t=>`<button class="chip ${filterKeys.has(t.key)?'on':''}" data-k="${esc(t.key)}">${esc(t.label)}<small>${t.ids.length}</small></button>`).join('')}
    </div>

    <h2 class="sec">Ajustes</h2>
    <div class="stack" style="margin-top:0">
      <label class="switch"><input type="checkbox" id="unl" ${S.unl?'checked':''}> Modo sin vidas (repaso sin límite de errores)</label>
      <label class="switch"><input type="checkbox" id="onlyp" ${S.onlyPending!==false?'checked':''}> Solo preguntas pendientes</label>
      <div class="row">
        <button class="chip ${S.theme==='auto'?'on':''}" data-th="auto">Auto</button>
        <button class="chip ${S.theme==='light'?'on':''}" data-th="light">Claro</button>
        <button class="chip ${S.theme==='dark'?'on':''}" data-th="dark">Oscuro</button>
      </div>
    </div>

    <div class="stack" style="margin-top:22px">
      <button class="btn" id="go10" ${sel.length?'':'disabled'}>Sesión de 10 (${Math.min(10,sel.length)})</button>
      <button class="btn blue" id="goall" ${sel.length?'':'disabled'}>Todas las seleccionadas (${sel.length})</button>
      <button class="btn ghost" id="gowrong">Solo las que fallé por última vez</button>
    </div>
    <div class="foot"><button class="linkbtn" id="reset">Reiniciar progreso</button></div>
  </div>`;
  document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;
    const k=b.dataset.k;
    if(k==='__all')filterKeys.clear();
    else{filterKeys.has(k)?filterKeys.delete(k):filterKeys.add(k);}
    home();
  });
  $app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();home();});
  document.getElementById('unl').onchange=e=>{S.unl=e.target.checked;save();};
  document.getElementById('onlyp').onchange=e=>{S.onlyPending=e.target.checked;save();home();};
  document.getElementById('go10').onclick=()=>start(shuffle(poolIds()).slice(0,10));
  document.getElementById('goall').onclick=()=>start(shuffle(poolIds()));
  document.getElementById('gowrong').onclick=()=>{
    const ids=QUESTIONS.filter(q=>S.lvl[q.id]===0&&S.tried&&S.tried[q.id]).map(q=>q.id);
    if(!ids.length){alert('Aún no tienes fallos recientes en la app. Haz una sesión primero.');return;}
    start(shuffle(ids));
  };
  document.getElementById('reset').onclick=()=>{if(confirm('¿Borrar todo el progreso, XP y racha?')){S={lvl:{},xp:0,streak:0,lastDay:null,unl:false,seen:0,ok:0,theme:S.theme};save();home();}};
}
function poolIds(){
  let arr=QUESTIONS;
  if(filterKeys.size)arr=arr.filter(q=>filterKeys.has(q.temaKey||'—'));
  if(S.onlyPending!==false)arr=arr.filter(q=>!mastered(q.id));
  return arr.map(q=>q.id);
}

/* ---------- SESSION ---------- */
function start(ids){
  if(!ids.length)return;
  sess={ids:ids.slice(),queue:ids.slice(),total:ids.length,done:new Set(),hearts:5,xp:0,firstOk:0,misses:[],attempt:{},sel:null,checked:false,retry:new Set(),over:false};
  touchStreak();save();
  renderQ();
}
function Q(id){return QUESTIONS.find(q=>q.id===id);}
function renderQ(){
  if(!sess.queue.length){return summary();}
  const q=Q(sess.queue[0]);
  const pct=Math.round(sess.done.size/sess.total*100);
  const isRetry=sess.retry.has(q.id);
  const opts=LETTERS.filter(L=>q.opts[L]!=null&&q.opts[L]!=='');
  $app.innerHTML=`
  <div class="wrap">
    <div class="qtop">
      <button class="x" id="quit" aria-label="Salir">✕</button>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="hearts">${S.unl?'∞':'❤️ '+sess.hearts}</div>
    </div>
    <div class="tema">${isRetry?'<span class="tag retry">REPETIR</span>':''}${q.wrong&&!isRetry?'<span class="tag was">FALLASTE ANTES</span>':''}${esc(q.temaLabel||'')}</div>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts" id="opts">
      ${opts.map((L,i)=>`<button class="opt" data-l="${L}"><span class="k">${i+1}</span><span><b>${L}.</b> ${esc(q.opts[L])}</span></button>`).join('')}
    </div>
  </div>
  <div class="sheet" id="sheet"><div class="in"><button class="btn" id="check" disabled>Comprobar</button></div></div>`;
  sess.sel=null;sess.checked=false;
  document.getElementById('quit').onclick=()=>{if(confirm('¿Salir de la sesión? Se conserva lo que ya hayas aprendido.')){save();home();}};
  $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(sess.checked)return;select(b.dataset.l);});
  document.getElementById('check').onclick=check;
  window.scrollTo(0,0);
}
function select(L){
  sess.sel=L;
  $app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.dataset.l===L));
  document.getElementById('check').disabled=false;
}
function check(){
  if(sess.checked||!sess.sel)return;
  sess.checked=true;
  const q=Q(sess.queue[0]);
  const ok=sess.sel===q.correct;
  const first=!sess.attempt[q.id];
  sess.attempt[q.id]=(sess.attempt[q.id]||0)+1;
  S.tried=S.tried||{};
  $app.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const l=b.dataset.l;
    b.classList.remove('sel');
    if(l===q.correct){b.classList.add('ok','pop');}
    else if(l===sess.sel){b.classList.add('bad','shake');}
    else b.classList.add('dim');
  });
  S.seen=(S.seen||0)+1;
  if(ok){
    S.ok=(S.ok||0)+1;
    const gain=first?10:5;
    sess.xp+=gain;S.xp=(S.xp||0)+gain;
    if(first){sess.firstOk++;S.lvl[q.id]=Math.min(3,lvl(q.id)+1);S.tried[q.id]=false;}
    sess.done.add(q.id);
  }else{
    if(first){S.lvl[q.id]=0;S.tried[q.id]=true;}
    sess.misses.push(q.id);
    if(!S.unl)sess.hearts--;
    sess.queue.push(q.id);sess.retry.add(q.id);
  }
  save();
  const sheet=document.getElementById('sheet');
  const hasE=q.expl&&q.expl.trim().length>0;
  let explHtml='';
  if(hasE){explHtml=`<div class="expl">${esc(q.expl)}${q.truncated?' […]':''}</div>`+(q.truncated?'<div class="note">La explicación estaba cortada en la captura original.</div>':'');}
  else explHtml='<div class="note">Sin explicación en la captura original.</div>';
  const was=(q.wrong&&first)?`<div class="note">La vez anterior marcaste <b>${q.wrong}</b>.</div>`:'';
  sheet.className='sheet '+(ok?'ok':'bad')+(hasE?' tall':'');
  sheet.innerHTML=`<div class="in">
    <div class="fb-h">${ok?'✅ ¡Correcto!':'❌ Incorrecto'}${ok&&first?' <span style="margin-left:auto;font-size:14px">+10 XP</span>':''}</div>
    ${ok?'':`<div class="fb-ans"><b>Respuesta correcta: ${q.correct}.</b> ${esc(q.opts[q.correct]||'')}</div>`}
    ${was}${explHtml}
    <button class="btn cont" id="next">Continuar</button>
  </div>`;
  document.getElementById('next').onclick=next;
  if(sess.hearts<=0&&!S.unl&&!ok){sess.over=true;}
}
function next(){
  sess.queue.shift();
  if(sess.over){return outOfHearts();}
  renderQ();
}
function outOfHearts(){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="big" style="font-size:48px">💔</div><h3>Te quedaste sin vidas</h3><p>Repasa lo que has fallado y vuelve a intentarlo.</p>
    <button class="btn" id="m1">Terminar sesión</button><div style="height:10px"></div><button class="btn ghost" id="m2">Seguir con vidas infinitas</button></div>`;
  document.body.appendChild(bg);
  document.getElementById('m1').onclick=()=>{bg.remove();summary(true);};
  document.getElementById('m2').onclick=()=>{bg.remove();S.unl=true;save();sess.over=false;sess.hearts=5;renderQ();};
}
function summary(dead){
  const n=sess.done.size;
  const acc=sess.firstOk&&sess.total?Math.round(sess.firstOk/sess.total*100):0;
  const misses=[...new Set(sess.misses)];
  $app.innerHTML=`
  <div class="wrap sum center">
    <div class="big">${dead?'💔':(acc>=80?'🏆':(acc>=50?'💪':'📚'))}</div>
    <h1>${dead?'Sesión terminada':'¡Sesión completada!'}</h1>
    <p class="small">${dead?'Te quedaste sin vidas.':'Has repasado todas las preguntas de esta sesión.'}</p>
    <div class="statgrid" style="margin:18px 0">
      <div class="stat b"><b>${sess.xp}</b><span>XP</span></div>
      <div class="stat g"><b>${acc}%</b><span>A la primera</span></div>
      <div class="stat r"><b>${misses.length}</b><span>Falladas</span></div>
    </div>
    ${misses.length?`<h2 class="sec" style="text-align:left">A repasar</h2><div class="rlist">${misses.map(id=>{const q=Q(id);return `<div class="ritem"><div class="q">${esc(q.stem.length>170?q.stem.slice(0,170)+'…':q.stem)}</div><b>${q.correct}.</b> ${esc(q.opts[q.correct]||'')}</div>`;}).join('')}</div>`:'<p style="font-size:18px">Cero errores. Así se hace. 🔥</p>'}
    <div class="stack" style="margin-top:22px">
      ${misses.length?'<button class="btn blue" id="again">Repetir las falladas</button>':''}
      <button class="btn" id="homeb">Volver al inicio</button>
    </div>
  </div>`;
  const a=document.getElementById('again');
  if(a)a.onclick=()=>start(shuffle(misses));
  document.getElementById('homeb').onclick=home;
  if(!dead&&acc>=80)burst();
}
function burst(){
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');
  const cols=['#58cc02','#1cb0f6','#ff9600','#ffc800','#ff4b4b'];
  const P=Array.from({length:110},()=>({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<160)requestAnimationFrame(tick);else c.remove();})();
}
document.addEventListener('keydown',e=>{
  if(!sess||!document.getElementById('opts')&&!document.getElementById('next'))return;
  const k=e.key;
  if(!sess.checked){
    const opts=[...$app.querySelectorAll('.opt')];
    if(/^[1-5]$/.test(k)&&opts[+k-1]){select(opts[+k-1].dataset.l);}
    else if(/^[a-eA-E]$/.test(k)){const b=opts.find(o=>o.dataset.l===k.toUpperCase());if(b)select(b.dataset.l);}
    else if(k==='Enter'){check();}
  }else if(k==='Enter'){const n=document.getElementById('next');if(n)n.click();}
});
home();
})();
</script>
</body>
</html>
