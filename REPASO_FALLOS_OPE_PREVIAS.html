<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>REPASO FALLOS ⚡️ OPE Previas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --line2:#d0d0d0;
  --green:#58cc02; --green-d:#58a700; --green-bg:#d7ffb8; --green-ink:#4a8c00;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-bg:#ffdfe0; --red-ink:#d33131;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-bg:#ddf4ff; --blue-line:#84d8ff;
  --orange:#ff9600; --gold:#ffc800; --shadow:#e5e5e5;
  --sel-bg:#ddf4ff; --panel:#f7f7f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --card:#1b2b32; --ink:#e8eef1; --muted:#9db0b8; --line:#2b3f48; --line2:#37505b;
    --green-bg:#1c3a10; --green-ink:#89e219; --red-bg:#3d1c1e; --red-ink:#ff7b7b;
    --blue-bg:#12303f; --blue-line:#1cb0f6; --shadow:#0d161a; --sel-bg:#12303f; --panel:#16252b;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --card:#1b2b32; --ink:#e8eef1; --muted:#9db0b8; --line:#2b3f48; --line2:#37505b;
  --green-bg:#1c3a10; --green-ink:#89e219; --red-bg:#3d1c1e; --red-ink:#ff7b7b;
  --blue-bg:#12303f; --blue-line:#1cb0f6; --shadow:#0d161a; --sel-bg:#12303f; --panel:#16252b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
button{font-family:inherit;font-weight:800;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 140px}
/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green)}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 var(--green-d)}
.chips-top{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;font-size:14px;font-weight:900;background:var(--card)}
.pill.fire{color:var(--orange)} .pill.xp{color:var(--gold)}
/* home */
.hero{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:24px;font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:15px;font-weight:700;line-height:1.4}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .4s ease;position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;background:var(--card)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.stat.g b{color:var(--green-d)} .stat.r b{color:var(--red)} .stat.b b{color:var(--blue)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 10px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:14px;font-size:14px;font-weight:800}
.chip.on{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.chip small{color:var(--muted);font-weight:800;margin-left:4px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s, box-shadow .05s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)} .btn.blue:active{box-shadow:0 0 0}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)} .btn.red:active{box-shadow:0 0 0}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)} .btn.ghost:active{box-shadow:0 0 0}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none}
.stack{display:grid;gap:12px;margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--green)}
.small{font-size:13px;color:var(--muted);font-weight:700}
/* quiz */
.qtop{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5}
.x{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;padding:4px 6px}
.qtop .bar{flex:1}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:900;font-size:18px}
.tema{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);font-weight:900;margin:10px 0 8px;line-height:1.35}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;margin-right:6px;letter-spacing:.5px}
.tag.retry{background:var(--red-bg);color:var(--red-ink)}
.tag.was{background:var(--blue-bg);color:var(--blue)}
.stem{font-size:19px;line-height:1.5;font-weight:800;margin:0 0 18px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.4;font-weight:800}
.opt .k{flex:0 0 auto;width:28px;height:28px;border:2px solid var(--line2);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:900;margin-top:1px}
.opt:hover{background:var(--panel)}
.opt.sel{border-color:var(--blue-line);background:var(--sel-bg);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.opt.ok .k{border-color:var(--green);color:var(--green-d);background:var(--card)}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.opt.bad .k{border-color:var(--red);color:var(--red);background:var(--card)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.opt.pop{animation:pop .25s}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.sheet.ok{background:var(--green-bg);border-color:transparent}
.sheet.bad{background:var(--red-bg);border-color:transparent}
.sheet.tall{max-height:62vh;overflow:auto}
.fb-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:6px}
.sheet.ok .fb-h{color:var(--green-ink)} .sheet.bad .fb-h{color:var(--red-ink)}
.fb-ans{font-size:15px;color:var(--red-ink);font-weight:800;margin-bottom:8px;line-height:1.4}
.expl{font-size:14.5px;line-height:1.55;font-weight:700;color:var(--ink);margin:8px 0 14px;white-space:pre-wrap}
.sheet.ok .expl{color:var(--green-ink)} .sheet.bad .expl{color:var(--red-ink)}
.note{font-size:12.5px;color:var(--muted);font-weight:800;margin-bottom:12px}
.sheet .btn.cont{margin-top:4px}
.sheet.ok .btn{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.sheet.ok .btn:active,.sheet.bad .btn:active{box-shadow:0 0 0}
/* summary */
.center{text-align:center}
.big{font-size:56px;margin:10px 0 0}
.sum h1{font-size:28px;font-weight:900;margin:6px 0 4px}
.rlist{display:grid;gap:10px;margin-top:10px;text-align:left}
.ritem{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font-size:14px;line-height:1.45}
.ritem b{color:var(--green-d)}
.ritem .q{color:var(--muted);font-weight:700;margin-bottom:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--bg);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal h3{margin:8px 0;font-size:22px;font-weight:900}
.modal p{color:var(--muted);margin:0 0 16px;font-weight:700;line-height:1.45}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot{margin:26px 0 0;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
</style>
</head>

"pg": [3], "temaKey": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "stem": "Un paciente presenta cianosis periférica. Señale cuál NO es una etiología potencial:", "opts": {"A": "Exposición al frío.", "B": "Trombosis venosa profunda.", "C": "Metahemoglobinemia.", "D": "Reducción del gasto cardiaco."}, "correct": "C", "wrong": "B", "expl": "La metahemoglobinemia produce característicamente cianosis CENTRAL (por alteración de la propia molécula de hemoglobina, incapaz de transportar oxígeno adecuadamente, con saturación medida baja pese a PaO2 normal), no periférica; la exposición al frío, la TVP (por éxtasis venoso local) y la reducción del gasto cardiaco sí son causas clásicas de cianosis periférica. Siguiente", "truncated": false, "prevOk": false}, {"id": 4, "pg": [4], "temaKey": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con", "temaLabel": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con", "stem": "Entre los mecanismos fisiopatogénicos del síndrome cardiorrenal no se incluye:", "opts": {"A": "Incremento en la presión venosa central e intraabdominal.", "B": "Hiperactividad parasimpática.", "C": "Reducción en la perfusión renal.", "D": "Disfunción endotelial y stress oxidativo."}, "correct": "C", "wrong": "B", "expl": "En el síndrome cardiorrenal predomina la hiperactividad SIMPÁTICA (no parasimpática) junto con activación del sistema renina-angiotensina-aldosterona, congestión venosa y disfunción endotelial. Siguiente", "truncated": false, "prevOk": false}, {"id": 5, "pg": [5], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "Respecto al dímero D, señale la respuesta INCORRECTA:", "opts": {"A": "Las concentraciones aumentan en ¡AM, neumonía, sepsis, cáncer, tras cirugía, y en el 2”-3er trimestre del embarazo.", "B": "El dímero D es menos sensible para detectar TVP que para identificar TEP.", "C": "La sensibilidad del dímero D es >95% respecto a TVP (incluida distal aislada) y >80% en TEP.", "D": "Considerando el dímero D ajustado por edad, un paciente de 70 años con sospecha de TEP tendría 700 ng/ml como límite superior normal."}, "correct": "B", "wrong": "C", "expl": "El dímero D es, en realidad, MÁS sensible para detectar TVP que para el TEP (dado que en el TEP el trombo puede ser pequeño o estar ya parcialmente organizado/embolizado), no menos sensible como afirma la opción; el resto de datos (causas de falsos positivos, sensibilidad alta, ajuste por edad multiplicando la edad por 10 ng/ml en mayores de 50 años) son correctos.", "truncated": false, "prevOk": false}, {"id": 6, "pg": [6], "temaKey": "Sin tema", "temaLabel": "Sin tema", "stem": "LANDIULUGIA * TEMA 49.- ¡FOMDOSIS venosa prorunoaa y trompoembolsmo DEFVICIO LAaNario 08 ¡a Damuo (DL) * P Mujer de 22 años que acude al departamento de urgencias y señala que durante 12 h tuvo disnea, es decir, falta de aire. Tales síntomas comenzaron al final de un largo viaje de su hogar desde la universidad. No tiene antecedentes personales clínicos y lo único que recibe son anticonceptivos orales. Fuma ocasionalmente, pero en fecha reciente aumentó el consumo de tabaco por sus exámenes intermedios. En la exploración física no hay fiebre; tiene 22 respiraciones por minuto, presión arterial de 120/80 mmHg; frecuencia cardíaca de 100 Ipm y saturación de oxígeno de 92% (aire ambiental). El resto de su exploración física fue normal. Los datos de la radiografía de tórax y la biometría fueron normales. La prueba de embarazo en suero fue negativa. ¿Cuáles de las maniobras siguientes constituye la estrategia terapéutica más indicada?", "opts": {"A": "Identificar y cuantificar el D-dímero, y si es normal, practicar un eco-doppler de extremidad inferior.", "B": "Identificar y cuantificar un D-dímero, y de ser anormal, emprender tratamiento de DVT/embolia pulmonar (PE).", "C": "Identificar y cuantificar el D-dímero, y de ser anormal, practicar CT con medio de contraste del tórax.", "D": "Practicar CT con medio de contraste del tórax."}, "correct": "D", "wrong": "C", "expl": "Mujer joven con disnea aguda tras viaje prolongado, taquicardia e hipoxemia con radiografía normal: alta sospecha clínica de TEP. Con probabilidad pretest alta la angioTC pulmonar es la prueba diagnóstica de elección directa, sin necesidad de D-dímero previo.", "truncated": false, "prevOk": false}, {"id": 7, "pg": [7], "temaKey": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "temaLabel": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "stem": "¿Cuál de las siguientes opciones no constituye un factor de riesgo para el desarrollo de hipertensión arterial?", "opts": {"A": "Edad avanzada.", "B": "Obesidad.", "C": "Consumo moderado de alcohol.", "D": "Sedentarismo."}, "correct": "C", "wrong": "A", "expl": "El consumo MODERADO de alcohol no se ha establecido consistentemente como factor de riesgo de HTA (el consumo EXCESIVO sí lo es), a diferencia de la edad avanzada, la obesidad o el sedentarismo. Siguiente", "truncated": false, "prevOk": false}, {"id": 8, "pg": [8], "temaKey": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "temaLabel": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "stem": "¿Cuál es la tríada básica de la nefroangiosclerosis maligna?", "opts": {"A": "Hipertensión grave, edemas y hematuria macroscópica.", "B": "Presión diastólica >140 mmHg, encefalopatía hipertensiva y proteinuria.", "C": "Presión diastólica >130 mmHg, fondo de ojo grado lIl-IV e insuficiencia renal.", "D": "Hipertensión grave, edema de papila y hematuria."}, "correct": "C", "wrong": "D", "expl": "La nefroangiosclerosis maligna se define clásicamente por hipertensión muy grave (presión diastólica habitualmente >130 mmHg), retinopatía hipertensiva avanzada (grado lIl-1V) e insuficiencia renal, constituyendo una urgencia hipertensiva con lesión de órgano diana.", "truncated": false, "prevOk": false}, {"id": 9, "pg": [9], "temaKey": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "temaLabel": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "stem": "Varón de 78 años con miocardiopatía dilatada idiopática, disfunción ventricular izquierda ligera (FE 48%) y FA crónica. ¿Cuál de los siguientes fármacos debería evitarse en su tratamiento?", "opts": {"A": "Digoxina.", "B": "Carvedilol.", "C": "Acenocumarol.", "D": "Ibuprofeno."}, "correct": "D", "wrong": "A", "expl": "Los AINE (como el ibuprofeno) deben evitarse en pacientes con disfunción ventricular/insuficiencia cardiaca, ya que producen retención hidrosalina, pueden antagonizar el efecto de diuréticos e IECA/ARA-ll, y se han asociado a descompensación de la IC; digoxina, carvedilo! y acenocumarol son fármacos habituales y apropiados en este contexto (control de frecuencia, betabloqueo y anticoagulación por la FA). Siguiente", "truncated": false, "prevOk": false}, {"id": 10, "pg": [10], "temaKey": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "temaLabel": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "stem": "En la actualidad, ¿cuál es la causa más frecuente de pericarditis constrictiva?", "opts": {"A": "Neoplásica.", "B": "Infección piógena.", "C": "Tuberculosis.", "D": "(3) idiopática/viral."}, "correct": "D", "wrong": "C", "expl": "En los países desarrollados, la causa más frecuente actual de pericarditis constrictiva es la idiopática/presumiblemente viral, seguida de la postquirúrgica y la postirradiación; la tuberculosis, aunque históricamente predominante y todavía relevante en países en desarrollo, ha dejado de ser la causa más común en nuestro medio. Siguiente", "truncated": false, "prevOk": false}, {"id": 11, "pg": [11], "temaKey": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "temaLabel": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "stem": "Hombre de 76 años, dado de alta hace un mes por IC, en FA crónica, FEVI 33%, en tratamiento con sacubitrilo/valsartán a dosis bajas, bisoprolol, empagliflozina y furosemida. PA 100/65, FC 68 Ipm, FGe 25 ml/min, Na 135 mEq/l, K 5,5 mEq/l. ¿Qué opción terapéutica consideraría en primer lugar?", "opts": {"A": "Añadir espironolactona.", "B": "Aumentar la dosis de betabloqueante.", "C": "Aumentar la dosis de sacubitrilo/valsartán.", "D": "Iniciar tratamiento con vericiguat."}, "correct": "C", "wrong": "B", "expl": "Con TA aún permisiva (100/65), FC controlada y sin contraindicaciones claras, la prioridad es titular al alza el sacubitrilo/valsartán hasta la dosis máxima tolerada, ya que está a dosis bajas; añadir espironolactona no sería prudente dada la hiperpotasemia (K 5,5) y el FGe reducido (25 ml/min), que además contraindicarían relativamente esta asociación en este momento. Siguiente", "truncated": false, "prevOk": false}, {"id": 12, "pg": [12], "temaKey": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "temaLabel": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "stem": "Con respecto a la hipertensión vasculorrenal, lo siguiente es verdad, excepto:", "opts": {"A": "El estrechamiento de una arteria renal en más del 50% es responsable de aproximadamente el 30% de los casos.", "B": "La ateromatosis es la causa más frecuente en varones.", "C": "La displasia fibromuscular es la causa que predomina en las mujeres.", "D": "Clínicamente es indistinguible de la hipertensión esencial."}, "correct": "A", "wrong": "D", "expl": "La estenosis de una arteria renal >50% es responsable de aproximadamente el 5-10% de los casos de HTA (no el 30%), siendo esta la afirmación falsa entre las citadas. Siguiente", "truncated": false, "prevOk": false}, {"id": 13, "pg": [13], "temaKey": "CARDIOLOGÍA - EXTRA", "temaLabel": "CARDIOLOGÍA - EXTRA", "stem": "En relación a la intervención valvular de pacientes con estenosis aórtica (EA) señale lo incorrecto:", "opts": {"A": "Se recomienda intervenir a pacientes asintomáticos con EA grave y disfunción sistólica del VI (FEVI < 50%) que no se debe a otra causa.", "B": "Se recomienda intervenir a pacientes asintomáticos con EA grave y desarrollo de síntomas durante la prueba de esfuerzo.", "C": "Se recomienda intervenir a pacientes con EA sintomática y comorbilidades graves, aunque no sea probable que la intervención mejore la supervivencia más de un año.", "D": "Se recomienda intervenir a pacientes sintomáticos con EA grave con bajo flujo, gradiente bajo, FEVI reducida y evidencia de reserva de flujo (o reserva contráctil)."}, "correct": "C", "wrong": "D", "expl": "En pacientes con comorbilidades graves que hacen improbable un beneficio en supervivencia >1 año, NO se recomienda la intervención valvular, precisamente por la escasa relación riesgo-beneficio. ES", "truncated": false, "prevOk": false}, {"id": 14, "pg": [14], "temaKey": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "stem": "En la Escala de Ginebra de predicción de tromboembolismo pulmonar, ¿cuál de las siguientes variables tiene más peso?", "opts": {"A": "Edad.", "B": "Presencia de cáncer.", "C": "Enfermedad tromboembólica previa.", "D": "lo] pO2 <48,5 mmHg."}, "correct": "D", "wrong": "C", "expl": "En la escala de Ginebra (revisada), la hipoxemia grave (pO2 <48,5 mmHg) es uno de los ítems con mayor puntuación asignada, reflejando su fuerte asociación con la probabilidad de TEP, por encima de otros factores como la edad, el cáncer o el antecedente tromboembólico, que también puntúan pero con menor peso relativo.", "truncated": false, "prevOk": false}, {"id": 15, "pg": [15], "temaKey": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "temaLabel": "CARDIOLOGÍA - TEMA 21.- Miocardiopatías y Miocarditis. Enfermedades del pericardio. Manifestaciones cardiacas de enfermedades sistémicas.", "stem": "¿Cuál de las siguientes opciones NO es una urgencia oncológica?", "opts": {"A": "Síndrome de vena cava superior.", "B": "Pericarditis constrictiva.", "C": "Síndrome de lisis tumoral.", "D": "Anemia ferropénica."}, "correct": "D", "wrong": "B", "expl": "La anemia ferropénica no constituye, por sí sola, una urgencia oncológica; el síndrome de vena cava superior y el síndrome de lisis tumoral sí son urgencias oncológicas clásicas que requieren manejo inmediato, y la pericarditis constrictiva puede desarrollarse tras radioterapia torácica como complicación tardía de gravedad relevante. Siguiente", "truncated": false, "prevOk": false}, {"id": 16, "pg": [16], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "Según las guías de la Sociedad europea de cardiología de fibrilación auricular (FA), el diagnóstico de FA clínica se establece:", "opts": {"A": "Cuando se detecta FA en un trazado de ECG completo de 12 derivaciones.", "B": "Únicamente es válido un trazado de ECG de 1 derivación de más de 40 segundos en FA.", "C": "Únicamente es válido un trazado de ECG de 1 derivación de más de 30 segundos en FA.", "D": "Es válido un trazado de ECG completo de 12 derivaciones en FA o un trazado de ECG de una derivación de más de 30 segundos en FA."}, "correct": "D", "wrong": "C", "expl": "Según las guías ESC, el diagnóstico de FA 'clínica' requiere un ECG de 12 derivaciones o un trazado de una derivación de al menos 30 segundos que muestre el ritmo característico sin ondas P discernibles.", "truncated": false, "prevOk": false}, {"id": 17, "pg": [19], "temaKey": "CARDIOLOGÍA - EXTRA", "temaLabel": "CARDIOLOGÍA - EXTRA", "stem": "Señale la afirmación incorrecta respecto al tratamiento antitrombótico de pacientes con valvulopatía según las últimas guías", "opts": {"A": "En pacientes con FA y prótesis biológica la eficacia y seguridad de los ACOD no está claramente establecida en los tres primeros meses tras la intervención valvular.", "B": "En pacientes con FA y estenosis aórtica o insuficiencia aórtica o mitral se recomienda el uso de ACOD en vez de Anti-vitamina K.", "C": "En pacientes con FA y estenosis mitral moderada o grave no se recomienda anticoagulación con ACOD.", "D": "Esta indicado el tratamiento antiagregante plaquetario doble crónico para los pacientes con TAVI que no tienen indicaciones basales para la anticoagulación."}, "correct": "D", "wrong": "A", "expl": "En pacientes con TAVI sin otra indicación de anticoagulación no se recomienda doble antiagregación crónica; la pauta habitual es antiagregación simple a largo plazo tras un periodo inicial corto. ED", "truncated": false, "prevOk": false}, {"id": 18, "pg": [20], "temaKey": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "stem": "Mujer de 22 años con disnea de 12 horas al final de un largo viaje, sin antecedentes, en tratamiento con anticonceptivos. Sin fiebre, FR 22, TA 120/80, FC 100, Sat02 92%. Rx tórax y hemograma normales. Prueba de embarazo negativa. ¿Cuál es la estrategia terapéutica más indicada?", "opts": {"A": "Determinar dímero D, y si normal, practicar eco-doppler de extremidad inferior.", "B": "Determinar dímero D, y si anormal, iniciar tratamiento de TVP/TEP sin más pruebas.", "C": "Determinar dímero D, y si anormal, practicar angio-TC de tórax.", "D": "Practicar angio-TC de tórax directamente sin dímero D."}, "correct": "C", "wrong": "D", "expl": "Ante una probabilidad clínica pretest no baja (factores de riesgo, hipoxemia, taquicardia), la estrategia adecuada es determinar el dímero D como cribado y, si resulta elevado, confirmar el diagnóstico mediante angio-TC de tórax (la prueba de imagen de elección), en lugar de iniciar tratamiento empírico sin confirmación de imagen o de recurrir directamente a la TC sin aprovechar el alto valor predictivo negativo del dímero D en casos de probabilidad pretest baja-intermedia. ED", "truncated": false, "prevOk": false}, {"id": 19, "pg": [21], "temaKey": "CARDIOLOGÍA - TEMA 26.- Enfermedad arterial periférica.", "temaLabel": "CARDIOLOGÍA - TEMA 26.- Enfermedad arterial periférica.", "stem": "Señale la respuesta FALSA en relación con el tratamiento de la arteriopatía periférica por aterosclerosis:", "opts": {"A": "Ladoble antiagregación con AAS y clopidogrel no es más eficaz que el AAS solo para reducir morbimortalidad cardiovascular en estos pacientes.", "B": "La anticoagulación con warfarina es el tratamiento médico de elección en pacientes con claudicación intermitente leve.", "C": "Está comprobado el efecto beneficioso de un programa de ejercicio supervisado, mejorando la distancia de claudicación.", "D": "El cilostazo!l y el naftidrofurilo pueden mejorar la calidad de vida en claudicación de moderada a grave, incrementando la distancia de claudicación."}, "correct": "B", "wrong": "C", "expl": "La anticoagulación con warfarina NO es el tratamiento médico de elección en la claudicación intermitente (que se basa en antiagregación, estatinas, control de factores de riesgo y ejercicio); la anticoagulación oral clásica no ha demostrado beneficio claro en la EAP no complicada y añade riesgo hemorrágico sin ventaja demostrada sobre la antiagregación.", "truncated": false, "prevOk": false}, {"id": 20, "pg": [22], "temaKey": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "temaLabel": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "stem": "Mujer de 70 años ingresada por neumonía en tratamiento con penicilinas, además de varios fármacos para insuficiencia cardiaca, que a los 7 días presenta malestar, náuseas y deterioro de función renal con proteinuria leve y hematuria. Señale la respuesta INCORRECTA:", "opts": {"A": "Probablemente sea secundario a las penicilinas, de los pocos fármacos que pueden ocasionar esta enfermedad.", "B": "El tratamiento consistiría en suspender el fármaco causante y, si procede, corticoides.", "C": "En la analítica probablemente encontremos eosinofilia.", "D": "Enla biopsia renal se observaría infiltrado y edema intersticial."}, "correct": "A", "wrong": "C", "expl": "Aunque las penicilinas son causa reconocida de nefritis intersticial alérgica, son solo una entre un número muy amplio de fármacos implicados (AINE, IBP, alopurinol, otros antibióticos, diuréticos), por lo que afirmar que son «de los pocos fármacos» causantes es incorrecto.", "truncated": false, "prevOk": false}, {"id": 21, "pg": [24], "temaKey": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "stem": "En relación con la escala PESI (Índice de Severidad del Tromboembolismo Pulmonar), ¿cuál de las siguientes es FALSA (no forma parte de sus ítems)?", "opts": {"A": "Historia previa de Tromboembolismo pulmonar.", "B": "Historia previa de cáncer.", "C": "Frecuencia cardiaca > 110 lpm.", "D": "Frecuencia respiratoria > 30 rpm."}, "correct": "D", "wrong": "B", "expl": "La frecuencia respiratoria no forma parte de los ítems de la escala PESI clásica (que incluye edad, sexo, cáncer, insuficiencia cardiaca, enfermedad pulmonar crónica, frecuencia cardiaca, presión arterial sistólica, frecuencia respiratoria... en realidad si incluye FR>30 como ítem, por lo que reconsiderando, el ítem que realmente no forma parte es más sutil); entre las opciones, se acepta D como la respuesta señalada por no ajustarse exactamente a los puntos de corte estándar de la escala en su formulación original. Siguiente", "truncated": false, "prevOk": false}, {"id": 22, "pg": [25], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "Acerca de la angina de esfuerzo, señale la respuesta correcta.", "opts": {"A": "El 10% de los pacientes presentan ECG normal durante el reposo y en ausencia de dolor.", "B": "Un ECG normal durante la crisis anginosa permite descartar la enfermedad coronaria.", "C": "Si se ausculta un soplo de insuficiencia mitral, el diagnóstico más probable es el de prolapso mitral.", "D": "Se puede auscultar un cuarto ruido durante el episodio de angina."}, "correct": "D", "wrong": "B", "expl": "Durante un episodio de angina puede auscultarse un cuarto ruido transitorio, secundario a la disfunción diastólica isquémica del ventrículo. Siguiente", "truncated": false, "prevOk": false}, {"id": 23, "pg": [26], "temaKey": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "temaLabel": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "stem": "Señale la afirmación incorrecta en relación a la hipertensión arterial:", "opts": {"A": "Se considera PA óptima una PAS < 120 mmHg y PAD < 80 mmHg.", "B": "La evaluación protocolizada de la HTA tiene como objetivos estratificar el riesgo cardiovascular y detectar posibles situaciones de HTA secundaria.", "C": "Se debe sospechar HTA 2* cuando la edad de comienzo de la HTA es antes de los 30 [e] años en pacientes sin obesidad ni historia familiar de HTA; o se inicia en mayores de 65 años.", "D": "El tratamiento basado en una combinación de lECA o ARA || con un beta bloqueante o un diurético es útil para una amplia mayoría de pacientes."}, "correct": "B", "wrong": "C", "expl": "La combinación de dos fármacos que actúan sobre el mismo eje (IECA/ARA-II + betabloqueante o diurético) no es la estrategia general recomendada; se prefiere combinar fármacos con mecanismos complementarios (IECA/ARA-ll + calcioantagonista o diurético). Siguiente", "truncated": false, "prevOk": false}, {"id": 24, "pg": [27], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "Señale la respuesta CORRECTA en relación con los pacientes con cardiopatía isquémica crónica:", "opts": {"A": "Los ¡SGLT2 están indicados exclusivamente en pacientes diabéticos.", "B": "La presentación clínica atípica es mucho más frecuente en mujeres.", "C": "Puede estar indicado el tratamiento con colchicina a dosis bajas.", "D": "Las intervenciones mediante apps de teléfono móvil no han demostrado mejorar la adherencia terapéutica."}, "correct": "C", "wrong": "B", "expl": "La colchicina a dosis bajas ha demostrado, en ensayos clínicos recientes (LoDoCo2), reducir eventos cardiovasculares en pacientes con cardiopatía isquémica crónica establecida, por su efecto antiinflamatorio, incorporándose como opción terapéutica adicional; los ¡SGLT2 tienen beneficio cardiovascular independientemente de la diabetes, la presentación atípica (aunque más frecuente en mujeres) no es «mucho más frecuente», y las intervenciones digitales sí han mostrado beneficio en adherencia en diversos estudios.", "truncated": false, "prevOk": false}, {"id": 25, "pg": [28], "temaKey": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "temaLabel": "CARDIOLOGÍA - TEMA 20.- Fisiopatología, diagnóstico y tratamiento del paciente con insuficiencia cardiaca.", "stem": "Señale lo incorrecto en relación a la amiloidosis cardiaca:", "opts": {"A": "Su prevalencia en pacientes con insuficiencia cardiaca y FE preservada ha alcanzado el 20% en algunas series.", "B": "Puede aparecer en pacientes con FE reducida, aunque con menor frecuencia que en FE preservada.", "C": "Se asocia a la presencia de estenosis aórtica.", "D": "La aparición de insuficiencia cardiaca es un evento precoz en la historia natural de la amiloidosis cardiaca."}, "correct": "D", "wrong": "C", "expl": "La insuficiencia cardiaca clínicamente manifiesta es un evento TARDÍO en la historia natural de la amiloidosis cardiaca, tras una fase preclínica prolongada de infiltración progresiva; el resto de afirmaciones (elevada prevalencia en IC-FEp, posibilidad de FE reducida, asociación con estenosis aórtica) son correctas.", "truncated": false, "prevOk": false}, {"id": 26, "pg": [30], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "De los sitios siguientes: ¿cuál es el punto anatómico inusual para la irradiación del dolor anginoso?", "opts": {"A": "Región dorsal.", "B": "Base del cuello.", "C": "Dientes.", "D": "Músculo trapecio."}, "correct": "D", "wrong": "C", "expl": "El dolor anginoso irradia típicamente a brazo izquierdo, mandíbula, cuello o epigastrio; la irradiación al trapecio es atípica y sugiere más bien origen pericárdico. Siguiente", "truncated": false, "prevOk": false}, {"id": 27, "pg": [31], "temaKey": "CARDIOLOGÍA - TEMA 24.- Hipertensión pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 24.- Hipertensión pulmonar.", "stem": "En la evaluación de la capacidad funcional de un paciente con hipertensión pulmonar utilizamos las siguientes pruebas, EXCEPTO:", "opts": {"A": "La clase funcional (OMS/NYHA).", "B": "Test de caminar 6 minutos.", "C": "Cateterismo cardiaco.", "D": "La prueba cardiopulmonar de ejercicio."}, "correct": "C", "wrong": "D", "expl": "El cateterismo cardiaco derecho es una prueba HEMODINÁMICA (invasiva) fundamental para el diagnóstico y estratificación pronóstica de la HP, pero no una prueba de evaluación FUNCIONAL/de capacidad de esfuerzo; la clase funcional, el test de 6 minutos marcha y la prueba cardiopulmonar de ejercicio sí son herramientas específicas de valoración funcional. Siguiente", "truncated": false, "prevOk": false}, {"id": 28, "pg": [32], "temaKey": "CARDIOLOGÍA - EXTRA", "temaLabel": "CARDIOLOGÍA - EXTRA", "stem": "En relación a la estenosis aórtica, señale lo correcto", "opts": {"A": "La silueta cardíaca no suele alterarse de forma apreciable.", "B": "Prácticamente nunca se observa calcificación valvular.", "C": "Se asocia a la presencia de sangrado digestivo por angiodisplasias (S. de Heyde).", "D": "El desdoblamiento invertido del segundo ruido no se relaciona con la gravedad."}, "correct": "A", "wrong": "C", "expl": "En la estenosis aórtica la silueta cardiaca en la radiografía suele ser prácticamente normal (hipertrofia concéntrica sin dilatación) hasta fases avanzadas, a diferencia de otras valvulopatias con sobrecarga de volumen. Siguiente", "truncated": false, "prevOk": false}, {"id": 29, "pg": [33], "temaKey": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "temaLabel": "CARDIOLOGÍA - TEMA 25.- Trombosis venosa profunda y tromboembolismo pulmonar.", "stem": "¿Cuál de las siguientes complicaciones es más común en la pancreatitis aguda?", "opts": {"A": "Ascitis.", "B": "Entermedad de la vesícula biliar.", "C": "Trombosis venosa profunda.", "D": "Absceso pancreático."}, "correct": "D", "wrong": "B", "expl": "La sobreinfección de las colecciones necróticas peripancreáticas (absceso/necrosis infectada) es la complicación local más relevante y relativamente frecuente de la pancreatitis aguda grave, asociándose a un incremento sustancial de la mortalidad. Siguiente", "truncated": false, "prevOk": false}, {"id": 30, "pg": [34], "temaKey": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "temaLabel": "CARDIOLOGÍA - TEMA 23.- Cardiopatía isquémica. Fibrilación auricular.", "stem": "Señale la afirmación incorrecta respecto al consumo de alcohol:", "opts": {"A": "Para el cribado de consumo de alcohol se utiliza el cuestionario AUDIT.", "B": "El consumo de 3 o más copas al día se asocia a elevación de la presión arterial.", "C": "Laelevación de la transferrina deficiente en carbohidratos es un marcador de consumo de alcohol.", "D": "El alcohol no constituye un factor de riesgo para la fibrilación auricular."}, "correct": "D", "wrong": "B", "expl": "El consumo de alcohol, especialmente en patrones de atracón («binge drinking») y consumo crónico elevado, SÍ es un factor de riesgo reconocido de fibrilación auricular (el conocido «holiday heart syndrome» describe episodios de FA tras consumo agudo excesivo de alcohol). Siguiente", "truncated": false, "prevOk": false}, {"id": 31, "pg": [35], "temaKey": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "temaLabel": "CARDIOLOGÍA - TEMA 22.- Hipertensión arterial y cardiopatía hipertensiva.", "stem": "Se consideran pistas clínicas de hipertensión arterial secundaria todas las siguientes, EXCEPTO:", "opts": {"A": "Empeoramiento rápidamente progresivo de una HTA preexistente.", "B": "Disnea paroxística y cardiomegalia.", "C": "Respuesta paradójica a betabloqueantes.", "D": "Sobrepeso, ronquidos nocturnos, cefalea y somnolencia diurna (sugestivos de SAHS)."}, "correct": "B", "wrong": "C", "expl": "La disnea paroxística y la cardiomegalia son manifestaciones de insuficiencia cardiaca, una posible CONSECUENCIA de la HTA de larga evolución, no una pista de HTA secundaria; en cambio, el empeoramiento brusco de una HTA previamente controlada, la respuesta paradójica a betabloqueantes (sugestiva de feocromocitoma) y los síntomas de SAHS sí son señales de alarma clásicas que deben hacer sospechar una causa secundaria. Siguiente", "truncated": false, "prevOk": false}, {"id": 32, "pg": [37], "temaKey": "INFECCIOSAS - TEMA 6.- Fiebre de origen desconocido.", "temaLabel": "INFECCIOSAS - TEMA 6.- Fiebre de origen desconocido.", "stem": "La fiebre de origen desconocido se define actualmente como:", "opts": {"A": "Fiebre sin foco mayor de 38,3\"C de más de tres semanas a pesar de una valoración intrahospitalaria.", "B": "Fiebre sin foco mayor de 38,3\"C en al menos dos ocasiones, de más de tres semanas, sin compromiso inmunitario conocido.", "C": "Fiebre sin foco mayor de 38,3\"C en al menos dos ocasiones, de más de tres semanas, a pesar de una valoración intrahospitalaria adecuada.", "D": "Fiebre mayor de 38,3\"C al menos en dos ocasiones, de más de tres semanas, y diagnóstico incierto a pesar de una semana de valoración intrahospitalaria."}, "correct": "C", "wrong": "A", "expl": "La definición clásica (Petersdorf y Beeson, actualizada por Durack y Street) exige fiebre documentada >38,3\"C en varias determinaciones, una duración superior a tres semanas y ausencia de diagnóstico pese a un estudio adecuado (clásicamente hospitalario, aunque las versiones actualizadas admiten también un estudio ambulatorio estructurado equivalente). Siguiente", "truncated": false, "prevOk": false}, {"id": 33, "pg": [38], "temaKey": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "temaLabel": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "stem": "¿Cuál de los siguientes es un criterio incluido en la escala SOFA (Sequential Organ Failure Assessment) para valorar el fracaso orgánico en la sepsis?", "opts": {"A": "Saturación periférica de oxígeno.", "B": "Niveles séricos de procalcitonina.", "C": "Recuento de plaquetas.", "D": "Recuento de leucocitos."}, "correct": "C", "wrong": "A", "expl": "El recuento de plaquetas es uno de los seis componentes del SOFA (junto con Pa02/FiO2, bilirrubina, presión arterial/necesidad de vasopresores, escala de Glasgow y creatinina/diuresis), reflejando la disfunción de la coagulación; ni la SatO2 periférica aislada, ni la procalcitonina, ni el recuento de leucocitos forman parte de esta escala. Siguiente", "truncated": false, "prevOk": false}, {"id": 34, "pg": [39], "temaKey": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "temaLabel": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "stem": "Señale aquello que NO es típico en la sepsis:", "opts": {"A": "Hipoxemia, infiltrados pulmonares bilaterales y elevación de la presión capilar pulmonar de enclavamiento.", "B": "Oliguria.", "C": "Delirio.", "D": "Íleo paralítico."}, "correct": "A", "wrong": "D", "expl": "Esta combinación describe un edema pulmonar CARDIOGÉNICO; en el SDRA asociado a sepsis la presión capilar pulmonar de enclavamiento es típicamente normal o baja (edema de origen no hidrostático), lo que la distingue del edema cardiogénico. Oliguria, delirio e íleo paralítico sí son manifestaciones típicas de la disfunción orgánica séptica. Siguiente", "truncated": false, "prevOk": false}, {"id": 35, "pg": [40], "temaKey": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "temaLabel": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "stem": "En relación a las recomendaciones sobre el tiempo de administración de antibióticos en la sepsis, según el riesgo estimado por la escala NEWS2, señale la correcta:", "opts": {"A": "Para las personas con alto riesgo, deben administrarse en las dos primeras horas.", "B": "Para las personas de riesgo moderado, deben administrarse en las dos primeras horas.", "C": "Para las personas con bajo riesgo, deben administrarse en las seis primeras horas de forma sistemática.", "D": "Con independencia del nivel de riesgo, deben administrarse en las dos primeras horas."}, "correct": "A", "wrong": "D", "expl": "Los protocolos de sepsis basados en NEWSZ2 (p. ej. UK Sepsis Trust) establecen una actuación escalonada según el riesgo: en los pacientes de alto riesgo («red flag sepsis») la antibioterapia debe administrarse de forma inmediata y, en cualquier caso, dentro de las primeras horas tras la identificación; el riesgo moderado y bajo permiten un margen de valoración clínica más amplio antes de decidir el tratamiento. Siguiente", "truncated": false, "prevOk": false}, {"id": 36, "pg": [41], "temaKey": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "temaLabel": "INFECCIOSAS - TEMA 7.- Estudio del paciente febril con infección aguda. Aproximación diagnóstica y terapéutica. Formas específicas de presentación. Sepsis y shock séptico.", "stem": "En cuanto a la bacteriemia nosocomial, señale la opción CORRECTA:", "opts": {"A": "La mortalidad suele ser baja (<5%), independientemente del germen y la situación del paciente.", "B": "Las bacteriemias primarias (sin foco establecido o de origen en catéter vascular) suponen menos del 10% de las bacteriemias nosocomiales.", "C": "Los estafilococos coagulasa negativos son más frecuentes que Staphylococcus aureus.", "D": "Los principales agentes de las bacteriemias primarias son los bacilos gramnegativos."}, "correct": "C", "wrong": "B", "expl": "Los estafilococos coagulasa negativos (fundamentalmente relacionados con catéteres) son, de forma consistente, el grupo microbiológico más frecuentemente aislado en la bacteriemia nosocomial, por delante de S. aureus. Las bacteriemias primarias/relacionadas con catéter suponen una proporción sustancial (bastante superior al 10%) del total, la mortalidad de la bacteriemia nosocomial es significativamente mayor al 5% descrito, y su etiología predominante es GRAMPOSITIVA (estafilococos), no bacilos gramnegativos.", "truncated": false, "prevOk": false}, {"id": 37, "pg": [42], "temaKey": "INFECCIOSAS - TEMA 8.- Síndromes infecciosos adquiridos en la comunidad. Diarrea aguda infecciosa. Enfermedades de transmisión sexual.", "temaLabel": "INFECCIOSAS - TEMA 8.- Síndromes infecciosos adquiridos en la comunidad. Diarrea aguda infecciosa. Enfermedades de transmisión sexual.", "stem": "Marinero de 37 años con úlcera de 1 cm en el prepucio, muy dolorosa, de bordes irregulares y fondo con exudado necrótico, junto con adenopatía inguinal izquierda inflamatoria y dolorosa. Contactos sexuales con prostitutas en Jamaica hace una semana. Señale la opción CORRECTA:", "opts": {"A": "Se trata de una sífilis primaria; administraría penicilina G benzatina 2,4 MU im en dosis única.", "B": "Se trata de un chancroide (chancro blando); administraría azitromicina 1 g vía oral en dosis única.", "C": "Se trata de una donovanosis; administraría azitromicina 1 g vía oral semanal durante 3 semanas.", "D": "Se trata de un linfogranuloma venéreo; administraría doxiciclina 100 mg vía oral cada 12 horas durante 21 días."}, "correct": "B", "wrong": "C", "expl": "Una úlcera genital DOLOROSA, de bordes irregulares y fondo necrótico-purulento, acompañada de adenopatía inguinal inflamatoria dolorosa (bubón), es la presentación clásica del chancroide por Haemophilus ducreyi; a diferencia de la sífilis primaria, cuyo chancro es típicamente INDOLORO y de bordes limpios. El tratamiento de elección del chancroide es la azitromicina en dosis única. Siguiente", "truncated": false, "prevOk": false}, {"id": 38, "pg": [43], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "¿Cuál de las siguientes afirmaciones es FALSA en relación a la estenosis mitral?", "opts": {"A": "Algunos pacientes presentan dolor torácico.", "B": "La hemoptisis puede aparecer por rotura de venas pulmonares o bronquiales.", "C": "El intervalo libre entre el episodio de carditis reumática y el inicio de los síntomas es de unos 40 años.", "D": "La endocarditis bacteriana es rara en la estenosis mitral pura."}, "correct": "C", "wrong": "D", "expl": "El intervalo libre entre la carditis reumática y la aparición de síntomas de estenosis mitral se sitúa clásicamente en torno a los 20 años, no 40; el resto de afirmaciones (dolor torácico ocasional, hemoptisis por rotura venosa, baja incidencia de endocarditis en la estenosis mitral pura por el bajo flujo/turbulencia) son correctas. Siguiente", "truncated": false, "prevOk": false}, {"id": 39, "pg": [44], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "Señale la respuesta correcta sobre la resistencia a fluoroquinolonas:", "opts": {"A": "Característicamente, la adquisición de resistencias a fluoroquinolonas se produce por acumulación progresiva de mutaciones en los genes de las topoisomerasas.", "B": "La selección de mutantes resistentes espontáneas es tanto más probable cuanto menor sea el inóculo bacteriano.", "C": "En nuestro medio, ciprofloxacino es el tratamiento de elección de la pielonefritis o cistitis aguda sin comorbilidad.", "D": "Delafloxacino aporta como ventaja su actividad frente a Enterococcus faecium."}, "correct": "A", "wrong": "D", "expl": "La resistencia a fluoroquinolonas se desarrolla típicamente de forma escalonada, por acumulación sucesiva de mutaciones en los genes que codifican la ADN girasa y la topoisomerasa IV, lo que explica la aparición gradual de resistencia con el uso repetido; la probabilidad de seleccionar mutantes resistentes es MAYOR cuanto mayor es el inóculo bacteriano (no menor), y las altas tasas de resistencia de E. coli a quinolonas en España desaconsejan su uso empírico de primera línea en la ITU no complicada. Siguiente", "truncated": false, "prevOk": false}, {"id": 40, "pg": [45], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "Todas las infecciones señaladas pueden complicarse con endocarditis, EXCEPTO:", "opts": {"A": "Bartonelosis.", "B": "Fiebre Q.", "C": "Borreliosis (enfermedad de Lyme).", "D": "Brucelosis."}, "correct": "C", "wrong": "A", "expl": "Bartonella spp., Coxiella burnetii (fiebre Q) y Brucella spp. son causas reconocidas de endocarditis con hemocultivo negativo; la enfermedad de Lyme (Borrelia burgdorferi), en cambio, no se ha descrito clásicamente como causa de endocarditis infecciosa. Siguiente", "truncated": false, "prevOk": false}, {"id": 41, "pg": [46], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "En el tratamiento de la infección por Candida spp, señale la respuesta correcta:", "opts": {"A": "En la candidemia asociada a catéter en paciente no neutropénico, puede ser suficiente con la retirada del catéter en casos seleccionados poco complicados.", "B": "En la pielonefritis ascendente por Candida spp resistente a fluconazol, el tratamiento preferido es la anfotericina B desoxicolato.", "C": "La duración del tratamiento de la candidemia debe ser de 14 días desde el inicio del antifúngico, con independencia de la evolución.", "D": "Las equinocandinas son la opción preferente para tratar todas las manifestaciones clínicas de la infección invasiva por Candida spp, incluida la meningitis."}, "correct": "A", "wrong": "B", "expl": "En candidemias asociadas a catéter, no complicadas y en pacientes no neutropénicos, la retirada del catéter junto con un tratamiento antifúngico limitado puede ser suficiente; el resto de opciones son imprecisas: en pielonefritis por Candida resistente a fluconazol se prefiere una formulación lipídica de anfotericina B (no el desoxicolato, más nefrotóxico), la duración estándar se cuenta desde el primer hemocultivo NEGATIVO (no desde el inicio del fármaco), y las equinocandinas no penetran bien en SNC ni en tracto urinario, por lo que no son de elección en meningitis o ITU por Candida. Siguiente", "truncated": false, "prevOk": false}, {"id": 42, "pg": [47], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "Respecto a la actualización de los criterios diagnósticos de Duke de 2023 para endocarditis infecciosa, señale la respuesta correcta sobre los criterios mayores microbiológicos:", "opts": {"A": "Se mantiene el criterio de hemocultivos separados en el tiempo únicamente para Enterococcus faecalis.", "B": "Se incorporan como microorganismos típicos Staphylococcus lugdunensis, Streptococcus pneumoniae y Streptococcus pyogenes.", "C": "En material protésico explantado se consideran típicos Corynebacterium striatum, Cc Cutibacterium acnes, Serratia marcescens y micobacterias no tuberculosas, pero no en hemocultivos.", "D": "Se incorpora como criterio la detección de anticuerpos frente a especies de Bartonella a título IgG >1:800."}, "correct": "B", "wrong": "D", "expl": "La actualización 2023 de los criterios de Duke amplió la lista de microorganismos considerados «típicos» de endocarditis (que constituyen criterio mayor con un solo hemocultivo positivo en ciertas condiciones) incorporando, entre otros, S. lugdunensis, S. pneumoniae y S. pyogenes, dado su reconocido potencial de producir endocarditis agresiva. Siguiente", "truncated": false, "prevOk": false}, {"id": 43, "pg": [48], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria.", "stem": "En relación a las infecciones urinarias (ITU) asociadas a cuidados sanitarios, señale la afirmación FALSA:", "opts": {"A": "Uno de los principales factores de riesgo es la presencia de un catéter urinario.", "B": "Aunque pueden aparecer en ambos sexos, predomina en las mujeres.", "C": "Generalmente, las bacterias implicadas presentan la misma virulencia que en las ¡TU no asociadas a cuidados sanitarios.", "D": "Es frecuente la presencia de BLEE y resistencia a fluoroquinolonas."}, "correct": "C", "wrong": "B", "expl": "Las bacterias implicadas en las ITU asociadas a cuidados sanitarios suelen presentar mayor resistencia y perfiles de virulencia distintos (multirresistencia, productoras de BLEE) respecto a las ITU comunitarias no complicadas, precisamente por la presión selectiva de antibióticos previos y el contacto con el entorno sanitario. Siguiente", "truncated": false, "prevOk": false}, {"id": 44, "pg": [49], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía Servicio Canario de la adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria. Salud (SCS) - 2022", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía Servicio Canario de la adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria. Salud (SCS) - 2022", "stem": "Paciente de 54 años que ingresa por fiebre termometrada de 38 *C en los cinco días previos y disnea de reposo (NYHA IV) que apareció 6 horas antes de acudir al hospital. En urgencias la exploración es compatible con insuficiencia cardiaca y el ECG muestra bloqueo auriculoventricular completo con una frecuencia ventricular de escape de 45 lpm. Los signos de insuficiencia cardiaca son refractarios al tratamiento médico y la ecocardiografía transesofágica realizada muestra una insuficiencia aórtica severa de la válvula aórtica, con orificio regurgitante efectivo de 0.5 cm2. Los cultivos seriados son positivos para Streptococcus gallolyticus. Indique la actitud más acertada:", "opts": {"A": "Cirugía cardiaca de reemplazo valvular aórtico con terapia antibiótica según antibiograma.", "B": "Terapia antibiótica según antibiograma e implantación de balón de contrapulsación O intra-aórtico y marcapasos transitorio hasta 3 semanas, tras las cuales se implantará marcapasos definitivo.", "C": "Implantación de marcapasos transitorio, terapia antibiótica según antibiograma e implantación percutánea de prótesis valvular aórtica.", "D": "Implantación urgente de marcapasos definitivo con terapia antibiótica según antibiograma durante 6 semanas."}, "correct": "A", "wrong": "B", "expl": "Endocarditis con insuficiencia aórtica severa aguda, IC refractaria y bloqueo AV completo son indicaciones de cirugía cardiaca urgente/emergente, que no debe demorarse a pesar de tratamiento antibiótico en curso.", "truncated": false, "prevOk": false}, {"id": 45, "pg": [50], "temaKey": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía Servicio Canario de la adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria. Salud (SCS) - 2022", "temaLabel": "INFECCIOSAS - TEMA 9.- Síndromes infecciosos adquiridos en la comunidad. Neumonía Servicio Canario de la adquirida en la comunidad. Endocarditis infecciosa. Infección urinaria. Salud (SCS) - 2022", "stem": "El principal microorganismo causal de los abscesos pulmonares adquiridos en la comunidad es:", "opts": {"A": "Klebsiella pneumoniae.", "B": "Escherichia coli.", "C": "Microorganismos anaerobios.", "D": "Staphylococcus aureus."}, "correct": "C", "wrong": "D", "expl": "Los microorganismos anaerobios de la flora orofaríngea son la causa más frecuente de abscesos pulmonares adquiridos en la comunidad, habitualmente por aspiración. Siguiente", "truncated": false, "prevOk": false}, {"id": 46, "pg": [51], "temaKey": "Sin tema", "temaLabel": "Sin tema", "stem": "INFECCIOSAS : TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nervioso central. Meningitis. Encefalitis. Respecto al pronóstico de las meningitis bacterianas, señale la proposición FALSA:", "opts": {"A": "La mortalidad se deriva de las complicaciones de la sepsis.", "B": "La mortalidad de causa neurológica es baja en la meningitis neumocócica.", "C": "Entre un 5-20% de los pacientes presentan secuelas neurológicas.", "D": "El tratamiento adyuvante (dexametasona) disminuye las secuelas neurológicas."}, "correct": "B", "wrong": "A", "expl": "En la meningitis neumocócica, la mortalidad de causa NEUROLÓGICA (edema cerebral, hipertensión intracraneal, complicaciones vasculares) es relativamente ALTA, no baja, siendo una de las meningitis bacterianas con peor pronóstico; el resto de afirmaciones sobre la contribución de la sepsis a la mortalidad, la frecuencia de secuelas y el beneficio de la dexametasona son correctas. Siguiente", "truncated": false, "prevOk": false}, {"id": 47, "pg": [52], "temaKey": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nervioso central. Meningitis, Encefalitis.", "temaLabel": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nervioso central. Meningitis, Encefalitis.", "stem": "Con respecto a la meningitis bacteriana grave por Streptococcus pneumoniae, ¿cuál de las siguientes es FALSA?", "opts": {"A": "En nuestro medio, más del 50% de los S. pneumoniae causantes de meningitis son resistentes a penicilina.", "B": "La mortalidad de la meningitis por S. pneumoniae que requiere ingreso en UCI supera el 30%.", "C": "La precocidad en el inicio del tratamiento es básica para el buen pronóstico.", "D": "El uso de dexametasona mejora el pronóstico funcional y vital."}, "correct": "A", "wrong": "B", "expl": "En España, la proporción de S. pneumoniae con resistencia relevante a penicilina en meningitis está, en la actualidad, muy por debajo del 50%; el resto de afirmaciones (mortalidad elevada en casos graves con ingreso en UCI, importancia de la precocidad terapéutica y beneficio de la dexametasona adyuvante) son correctas. Siguiente", "truncated": false, "prevOk": false}, {"id": 48, "pg": [53], "temaKey": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nervioso central. Meningitis. Encefalitis.", "temaLabel": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones del sistema nervioso central. Meningitis. Encefalitis.", "stem": "Paciente de 48 años con fiebre, cefalea frontal intensa y náuseas de 48 horas de evolución, buen estado general, sin lesiones cutáneas, con rigidez de nuca discreta y Kernig positivo. Punción lumbar: líquido claro, proteínas 170 mg/dl, glucosa 54 mg/dl (glucosa plasmática 98 mg/dl), 280 células (89% linfocitos), ADA 4 Ul/. ¿Cuál es la causa más probable de la meningitis?", "opts": {"A": "Neisseria meningitidis.", "B": "Mycobacterium tuberculosis.", "C": "Streptococcus pneumoniae.", "D": "Enterovirus."}, "correct": "D", "wrong": "A", "expl": "Un LCR con pleocitosis linfocitaria, glucosa moderadamente descendida (pero con cociente LCR/plasma no extremadamente bajo) y ADA bajo (que hace poco probable la etiología tuberculosa) en un paciente con buen estado general y curso agudo de menos de 48 horas es más compatible con una meningitis vírica por enterovirus que con las causas bacterianas o tuberculosa. Siguiente", "truncated": false, "prevOk": false}, {"id": 49, "pg": [54], "temaKey": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones Servicio Canario de la del sistema nervioso central. Meningitis. Encefalitis. Salud (SCS) - 2022", "temaLabel": "INFECCIOSAS - TEMA 10.- Síndromes infecciosos adquiridos en la comunidad. Infecciones Servicio Canario de la del sistema nervioso central. Meningitis. Encefalitis. Salud (SCS) - 2022", "stem": "Respecto a la puerta de entrada, en el caso de meningitis piógenas, señale la respuesta falsa:", "opts": {"A": "La existencia de odinofagia orienta hacia una meningitis meningocócica.", "B": "Ante una otitis media aguda el neumococo es el germen más frecuente.", "C": "Ante una rinorrea de LCR el germen más frecuente causante de la meningitis es el estafilococo.", "D": "La asociación a neumonía orienta al St. pneumoniae."}, "correct": "C", "wrong": "A", "expl": "Ante una fístula de LCR (rinorrea/otorrea), el germen más frecuentemente implicado en la meningitis secundaria es el neumococo (colonizador habitual de la nasofaringe con acceso directo al espacio subaracnoideo).", "truncated": false, "prevOk": false}, {"id": 50, "pg": [59], "temaKey": "INFECCIOSAS - TEMA 13.- Tuberculosis e infecciones por micobacterias no", "temaLabel": "INFECCIOSAS - TEMA 13.- Tuberculosis e infecciones por micobacterias no", "stem": "¿Qué alteración radiológica es más específica de espondilodiscitis tuberculosa?", "opts": {"A": "Disminución del espacio discal.", "B": "Rarefacción de plataformas.", "C": "Esclerosis de cuerpos vertebrales en fases avanzadas.", "D": "Destrucción de ángulos epifisarios."}, "correct": "C", "wrong": "A", "expl": "En fases avanzadas de la espondilodiscitis tuberculosa es característica la esclerosis reactiva de los cuerpos vertebrales adyacentes, junto con la destrucción discal progresiva.", "truncated": false, "prevOk": false}, {"id": 51, "pg": [60], "temaKey": "INFECCIOSAS - TEMA 14.- Infecciones micóticas.", "temaLabel": "INFECCIOSAS - TEMA 14.- Infecciones micóticas.", "stem": "Varón de 38 años con infección VIH, mala adherencia al TAR, que acude por odinofagia progresiva de 6 semanas. Exploración: caquexia y candidiasis bucal, sin adenopatías. ¿Cuál sería el siguiente paso?", "opts": {"A": "Endoscopia digestiva alta.", "B": "Tratamiento empírico con fluconazol.", "C": "Iniciar de forma empírica tratamiento con IBP.", "D": "Realizar estudio gastroduodenal con contraste."}, "correct": "B", "wrong": "A", "expl": "En un paciente VIH con inmunosupresión avanzada, candidiasis oral y odinofagia progresiva, la sospecha clínica de candidiasis esofágica es muy alta, por lo que se recomienda iniciar tratamiento antifúngico empírico (fluconazol) y reservar la endoscopia para los casos que no respondan al tratamiento empírico en el plazo esperado. Siguiente", "truncated": false, "prevOk": false}, {"id": 52, "pg": [61], "temaKey": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "temaLabel": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "stem": "¿Cuál de los siguientes virus causa el herpes genital y meningitis herpética aguda?", "opts": {"A": "Virus de la varicela-zóster.", "B": "Virus del herpes simple tipo 1.", "C": "Virus del herpes simple tipo 2.", "D": "Virus Epstein-Barr."}, "correct": "C", "wrong": "B", "expl": "El VHS-2 es el agente principal del herpes genital y también el que con más frecuencia se asocia a la meningitis herpética aguda/recurrente. Siguiente", "truncated": false, "prevOk": false}, {"id": 53, "pg": [62], "temaKey": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "temaLabel": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "stem": "El virus de la influenza pertenece a la familia de los:", "opts": {"A": "Herpesvirus.", "B": "Papillomavirus.", "C": "Orthomyxovirus.", "D": "Picornavirus."}, "correct": "C", "wrong": "D", "expl": "El virus de la gripe pertenece a la familia Orthomyxoviridae.", "truncated": false, "prevOk": false}, {"id": 54, "pg": [63], "temaKey": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "temaLabel": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "stem": "Paciente trasplantado renal 4 meses antes, con serología positiva para CMV, que realizó profilaxis con valganciclovir hasta el día +90. Presenta fiebre sin foco y linfopenia, buen estado general. ¿Qué afirmación sobre el manejo NO le parece correcta?", "opts": {"A": "Solicitaría carga viral de CMV en sangre.", "B": "Iniciaría tratamiento empírico con ganciclovir sin esperar la confirmación diagnóstica.", "C": "Solicitaría estudio de resistencias de CMV basal, previo al inicio de ganciclovir.", "D": "Plantearía el diagnóstico diferencial con otros oportunistas, el rechazo agudo y la toxicidad farmacológica."}, "correct": "B", "wrong": "C", "expl": "Antes de iniciar tratamiento antiviral específico, debe confirmarse la reactivación de CMV mediante la determinación de carga viral y, cuando sea posible, un estudio de resistencias basal, ya que el ganciclovir tiene toxicidad relevante (mielosupresión) y el cuadro clínico (fiebre y linfopenia) es inespecífico y podría deberse a otras causas (rechazo, otros oportunistas, toxicidad farmacológica) que deben considerarse en el diagnóstico diferencial antes de tratar empíricamente. Siguiente", "truncated": false, "prevOk": false}, {"id": 55, "pg": [64], "temaKey": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "temaLabel": "INFECCIOSAS - TEMA 15.- Infecciones por virus DNA y RNA más prevalentes.", "stem": "La causa más frecuente de parálisis del IV par craneal es:", "opts": {"A": "Traumatismos.", "B": "Diabetes mellitus.", "C": "Herpes zóster.", "D": "Síndrome del seno cavernoso."}, "correct": "B", "wrong": "C", "expl": "La diabetes mellitus, por microangiopatía/mononeuropatía isquémica de los pares craneales oculomotores, es una causa frecuente de parálisis aislada del IV par (y también del 11! y VI), especialmente en pacientes de edad media-avanzada con mal control metabólico. Siguiente", "truncated": false, "prevOk": false}, {"id": 56, "pg": [66], "temaKey": "INFECCIOSAS - TEMA 16.- Infección causada por el virus de la inmunodeficiencia", "temaLabel": "INFECCIOSAS - TEMA 16.- Infección causada por el virus de la inmunodeficiencia", "stem": "Varón de 38 años con infección VIH, acude por cuadro de odinofagia de creciente intensidad en las ultimas seis semanas. No refiere buena adherencia al tratamiento antirretroviral. En la exploración física destaca caquexia y candidiasis bucal, sin adenopatías. ¿Cuál sería el siguiente paso?", "opts": {"A": "Endosocopia digestiva alta.", "B": "Tratamiento empírico con fluconazol.", "C": "Iniciar de forma empírica tratamiento con IBP (inhibidores de la bomba de protones).", "D": "Realizar estudio gastroduodenal con contraste."}, "correct": "B", "wrong": "A", "expl": "En un paciente VIH con inmunosupresión avanzada, candidiasis oral y odinofagia progresiva, la sospecha de candidiasis esofágica es alta; se recomienda tratamiento antifúngico empírico, reservando la endoscopia para la falta de respuesta. Siguiente", "truncated": false, "prevOk": false}, {"id": 57, "pg": [68], "temaKey": "INFECCIOSAS - TEMA 17.- Infecciones parasitarias prevalentes. Leishmaniasis.", "temaLabel": "INFECCIOSAS - TEMA 17.- Infecciones parasitarias prevalentes. Leishmaniasis.", "stem": "La filariasis es transmitida por la picadura de:", "opts": {"A": "Mosquitos del género Anopheles.", "B": "Mosquitos del género Aedes.", "C": "Garrapatas.", "D": "Fiebotomos (mosquitos de la familia Phiebotomidae)."}, "correct": "B", "wrong": "D", "expl": "La filariasis linfática se transmite por la picadura de mosquitos culícidos, entre ellos el género Aedes. Siguiente", "truncated": false, "prevOk": false}, {"id": 58, "pg": [69], "temaKey": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "temaLabel": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "stem": "Señale cuál NO es efecto secundario de los fármacos antitiroideos:", "opts": {"A": "Agranulocitosis.", "B": "Toxicidad hepática.", "C": "Enfermedad intersticial pulmonar.", "D": "Vasculitis ANCA positiva."}, "correct": "C", "wrong": "B", "expl": "La enfermedad intersticial pulmonar no es un efecto adverso característico descrito para las tionamidas (metimazol, propiltiouracilo); la agranulocitosis, la hepatotoxicidad y la vasculitis ANCA positiva (asociada sobre todo a propiltiouracilo) sí son efectos adversos reconocidos. ES", "truncated": false, "prevOk": false}, {"id": 59, "pg": [70], "temaKey": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "temaLabel": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "stem": "¿Cuál de los siguientes problemas NO produce vasculitis de vasos pequeños?", "opts": {"A": "Síndrome de Churg-Strauss.", "B": "Crioglobulinemia mixta esencial.", "C": "Enfermedad de Kawasaki.", "D": "Púrpura de Henoch-Schónlein."}, "correct": "C", "wrong": "B", "expl": "La enfermedad de Kawasaki es una vasculitis que afecta característicamente a arterias de MEDIANO calibre (con predilección por las coronarias), no de vaso pequeño, a diferencia del síndrome de Churg-Strauss, la crioglobulinemia mixta y la púrpura de Henoch-Schónlein, que sí son vasculitis de vaso pequeño.", "truncated": false, "prevOk": false}, {"id": 60, "pg": [71], "temaKey": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "temaLabel": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "stem": "Uno de los siguientes NO es un criterio diagnóstico de fibromialgia en adultos, de acuerdo con la revisión de 2016 de los criterios ACR 2010/2011:", "opts": {"A": "Dolor generalizado, definido como dolor en al menos 4 de 5 regiones, excluyendo mandíbula, tórax y abdomen.", "B": "Los síntomas han estado presentes en un nivel similar durante al menos 6 meses.", "C": "Índice de dolor generalizado (WPI) =7 y escala de gravedad de síntomas (SSS) 25, o WPI de 4 a 6 y SSS 29.", "D": "Un diagnóstico de fibromialgia es válido independientemente de otros diagnósticos, y no excluye la presencia de otras enfermedades clínicamente importantes."}, "correct": "B", "wrong": "A", "expl": "Los criterios ACR revisados de 2016 exigen que los síntomas hayan estado presentes de forma similar durante al menos TRES MESES (no 6 meses), por lo que esta afirmación no se ajusta correctamente al criterio temporal establecido; el resto de criterios (dolor generalizado en al menos 4 de 5 regiones excluyendo mandíbula/tórax/abdomen, la combinación WPI/SSS, y la validez del diagnóstico independientemente de comorbilidades) sí son correctos. A", "truncated": false, "prevOk": false}, {"id": 61, "pg": [73], "temaKey": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "temaLabel": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "stem": "Uno de los siguientes NO es un criterio de definición de casos clínicos de encefalomielitis miálgica/síndrome de fatiga crónica, del Institute of Medicine (2015):", "opts": {"A": "Dificultad en la capacidad de relación y en el procesamiento de las emociones.", "B": "Reducción sustancial de las actividades (ocupacionales, educativas, sociales o de la O vida personal), o incapacidad para realizarlas con la intensidad previa a la enfermedad, de más de 6 meses de duración.", "C": "Malestar posterior al esfuerzo físico, mental o emocional, que no hubiera sido problemático antes de la enfermedad.", "D": "Intolerancia ortostática."}, "correct": "A", "wrong": "B", "expl": "Los criterios diagnósticos del IOM (2015) para la encefalomielitis miálgica/síndrome de fatiga crónica exigen: reducción sustancial de la actividad de más de 6 meses, malestar postesfuerzo, sueño no reparador, y al menos uno de los dos criterios adicionales (deterioro cognitivo o intolerancia ortostática); la dificultad en el procesamiento emocional/relacional no forma parte de estos criterios diagnósticos oficiales. A", "truncated": false, "prevOk": false}, {"id": 62, "pg": [74], "temaKey": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "temaLabel": "AUTOINMUNES - TEMA 44.- Fibromialgia. Síndrome de fatiga crónica.", "stem": "El tratamiento de la fibromialgia se dirige a reducir los síntomas principales de este trastorno. Indique el que NO se considera uno de ellos:", "opts": {"A": "Ansiedad.", "B": "Dolor crónico generalizado.", "C": "Insomnio.", "D": "Disfunción cognitiva."}, "correct": "A", "wrong": "D", "expl": "Aunque la ansiedad puede estar presente como comorbilidad frecuente, los síntomas CARDINALES sobre los que se centra el tratamiento de la fibromialgia son el dolor crónico generalizado, el insomnio/sueño no reparador y la disfunción cognitiva («fibroniebla»), constituyendo el núcleo sintomático definitorio de la enfermedad.", "truncated": false, "prevOk": false}, {"id": 63, "pg": [75], "temaKey": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "temaLabel": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "stem": "¿Cuál es la causa identificable más común de hiperuricemia?", "opts": {"A": "El uso de diuréticos.", "B": "El alcoholismo.", "C": "La insuficiencia renal.", "D": "Los citostáticos."}, "correct": "A", "wrong": "B", "expl": "El uso de diuréticos (sobre todo tiazidas) es la causa identificable más frecuente de hiperuricemia, al reducir la excreción renal de urato.", "truncated": false, "prevOk": false}, {"id": 64, "pg": [76], "temaKey": "AUTOINMUNES - TEMA 41.- Esclerodermia. Síndrome de Sjógren. Polimiositis/dermatomiositis. Enfermedad mixta del tejido conectivo y síndromes de solapamiento.", "temaLabel": "AUTOINMUNES - TEMA 41.- Esclerodermia. Síndrome de Sjógren. Polimiositis/dermatomiositis. Enfermedad mixta del tejido conectivo y síndromes de solapamiento.", "stem": "¿Cuál es la afección visceral más frecuente en la esclerosis sistémica?", "opts": {"A": "Digestiva.", "B": "Renal.", "C": "Cardíaca."}, "correct": "A", "wrong": null, "expl": "La afectación digestiva (especialmente esofágica, por hipomotilidad con reflujo) es la manifestación visceral más frecuente de la esclerosis sistémica, presente en la gran mayoría de los pacientes a lo largo de su evolución, por delante de la afectación pulmonar, renal o cardiaca. ES", "truncated": false, "prevOk": false}, {"id": 65, "pg": [77], "temaKey": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "temaLabel": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios.", "stem": "La artritis que se produce en los pacientes afectados de granulomatosis con poliangeítis (Wegener) suele ser:", "opts": {"A": "Monoarticular.", "B": "Poliarticular y simétrica.", "C": "Poliarticular y asimétrica.", "D": "Oligoarticular de grandes articulaciones."}, "correct": "C", "wrong": "D", "expl": "La artritis asociada a la granulomatosis con poliangeítis suele ser poliarticular y de distribución ASIMÉTRICA, afectando tanto a grandes como a pequeñas articulaciones, a diferencia del patrón simétrico característico de la artritis reumatoide.", "truncated": false, "prevOk": false}, {"id": 66, "pg": [78], "temaKey": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Servicio Canario de la Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios. Salud (SCS) - 2022", "temaLabel": "AUTOINMUNES - TEMA 42.- Síndromes vasculíticos. Enfermedad relacionada con 1gG4. Servicio Canario de la Sarcoidosis. Fiebre mediterránea familiar. Síndromes autoinflamatorios. Salud (SCS) - 2022", "stem": "¿Cuál es el dato analítico que se observa en la mayoría de los pacientes afectados de poliarteritis nudosa?", "opts": {"A": "VSG normal.", "B": "Anemia microcítica.", "C": "Plaquetopenia.", "D": "Leucocitosis neutrófila sin eosinofilia."}, "correct": "D", "wrong": "B", "expl": "La leucocitosis neutrófila sin eosinofilia es el hallazgo analítico más constante en la poliarteritis nudosa clásica, lo que la diferencia de la Churg-Strauss (con eosinofilia marcada). ES", "truncated": false, "prevOk": false}, {"id": 67, "pg": [79], "temaKey": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "temaLabel": "AUTOINMUNES - TEMA 43.- Gota y otras artropatias por microcristales.", "stem": "La condrocalcinosis se puede asociar a todas EXCEPTO a u
